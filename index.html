      rating:half(r['My Rating']),owned:pInt(r['Owned Copies'])>0,format:fmtOf(r['Binding']),category:shelves[0]||'',finishedAt:st==='done'?pDate(r['Date Read']):'',startedAt:'',
      review,summary:'',quotes:[],readCount:pInt(r['Read Count']),createdAt:(d=>d?new Date(d).getTime():0)(pDate(r['Date Added']))}}},
 {name:'The StoryGraph',test:h=>h.includes('Read Status')&&h.includes('Star Rating'),
  map:r=>{const rs=String(r['Read Status']).trim();const st={read:'done','currently-reading':'reading','to-read':'want','did-not-finish':'reading'}[rs]||'want';
    const tags=String(r['Tags']||'').split(',').map(x=>x.trim()).filter(Boolean);
    return {title:str(r['Title']),author:str(r['Authors']),publisher:'',isbn:cleanIsbn(r['ISBN/UID']),pages:0,current:0,status:st,rating:half(r['Star Rating']),
      owned:/^y/i.test(String(r['Owned?']||'')),format:fmtOf(r['Format']),category:tags[0]||'',finishedAt:st==='done'?pDate(r['Last Date Read']):'',startedAt:'',
      review:(rs==='did-not-finish'?'[중도 하차]\n':'')+stripHTML(r['Review']),summary:'',quotes:[],readCount:pInt(r['Read Count']),createdAt:(d=>d?new Date(d).getTime():0)(pDate(r['Date Added']))}}}
];
function detectPreset(rows){if(!rows||!rows.length)return null;const h=Object.keys(rows[0]);return PRESETS.find(p=>p.test(h))||null}
function finishPrepared(books){return books.filter(b=>b.title).map(b=>SUMCATS[b.category]?{...b,isSummary:true,category:''}:b).map((b,i)=>({...b,color:b.color||COLORS[hash(b.title)%COLORS.length],createdAt:b.createdAt||Date.now()-i}))}

function matchExisting(title){const t=nrm(title.replace(/\s*[\(:].*$/,''));if(t.length<2)return null;
  return list().find(b=>{const e=nrm(b.title.replace(/\s*[\(:].*$/,''));return e===t||(t.length>=4&&e.length>=4&&(e.startsWith(t)||t.startsWith(e)))})||null}
function parseKindle(text){
  const blocks=text.replace(/^\uFEFF/,'').split(/\r?\n?==========\r?\n?/).map(b=>b.trim()).filter(Boolean);
  const books=new Map();let found=0;
  for(const blk of blocks){const lines=blk.split(/\r?\n/);if(lines.length<2)continue;
    const head=lines[0].replace(/^\uFEFF/,'').trim(),meta=lines[1].trim(),body=lines.slice(2).join('\n').trim();
    if(!/^-\s/.test(meta))continue;found++;
    const isNote=/note|메모/i.test(meta),isMark=/bookmark|북마크/i.test(meta);if(isMark||!body)continue;
    let title=head,author='';const m=head.match(/^(.*)\(([^()]*)\)\s*$/);if(m){title=m[1].trim();author=m[2].trim()}
    if(/^[^,]+,\s*[^,]+$/.test(author)){const p=author.split(',').map(x=>x.trim());author=p[1]+' '+p[0]}
    const pm=meta.match(/(?:page|페이지)\s*(\d+)|(\d+)\s*페이지/i);const page=pm?(pm[1]||pm[2]):'';
    const dm=meta.match(/(?:Added on|추가된 날짜:?)\s*(.+)$/i);let at=0;if(dm){const d=pDate(dm[1].replace(/^[A-Za-z]+,\s*/,''));if(d)at=new Date(d).getTime()}
    const key=nrm(title);if(!books.has(key)){const ex=matchExisting(title);
      books.set(key,{title:ex?ex.title:title,author:ex?ex.author:author,publisher:'',isbn:'',pages:0,current:0,status:ex?ex.status:'done',rating:0,owned:false,format:'ebook',category:'',
        startedAt:'',finishedAt:'',review:'',summary:'',quotes:[],readCount:0,_matched:!!ex})}
    const b=books.get(key);
    if(isNote&&b.quotes.length){const last=b.quotes[b.quotes.length-1];last.text+='\n- '+body}
    else if(!b.quotes.some(q=>q.text===body||q.text.startsWith(body)))b.quotes.push({text:body,page,at})}
  return found?finishPrepared([...books.values()]):null}

async function readBookswing(file){
  const JSZip=await loadJSZip();const zip=await JSZip.loadAsync(file);
  const byName={};zip.forEach((p,f)=>{if(!f.dir)byName[p.split('/').pop()]=f});
  const bookNames=Object.keys(byName).filter(n=>/\.book$/i.test(n));if(!bookNames.length)return null;
  const out=[];let n=0;
  for(const name of bookNames){n++;if(n%15===0)renderImp(`책 정보를 읽는 중... ${n} / ${bookNames.length}`);
    let j;try{j=JSON.parse(await byName[name].async('string'))}catch(e){continue}
    if(!j||!j.title)continue;
    const acts=(j.activities||[]).slice().sort((a,b)=>(+a.date||0)-(+b.date||0));
    const placeholder=+j.pages===500;const pages=placeholder?0:(+j.pages||0);
    const status={0:'want',1:'done',2:'reading'}[j.status]||'want';
    const k=kind=>acts.filter(a=>+a.kind===kind);
    const started=k(5)[0];const startedAt=status==='want'?'':(started?sec2d(+started.date):sec2d(+j.readDate));
    let finishedAt='';if(status==='done'){const ends=[...k(4),...k(6)].map(a=>+a.date).filter(Boolean);finishedAt=ends.length?sec2d(Math.max(...ends)):(sec2d(+j.readDate)||sec2d(+j.date))}
    let current=0;if(status==='done')current=pages;else if(status==='reading'&&pages){const ps=k(4).map(a=>+a.page).filter(p=>p<pages);current=ps.length?Math.max(...ps):0}
    const pg=p=>{p=+p;return p>1&&p!==500&&p!==+j.pages?String(p):''};
    const quotes=[];
    for(const a of k(0)){const t=String(a.quote||'').trim();if(t)quotes.push({text:t+(a.text&&String(a.text).trim()?'\n- '+String(a.text).trim():''),page:pg(a.page),at:(+a.date||0)*1000})}
    for(const a of k(1)){const f=byName[String(a.photo||'').split('/').pop()];if(!f)continue;
      try{const {url}=await imgToData(await f.async('blob'),640,.72);quotes.push({text:String(a.text||'').trim(),photo:url,page:pg(a.page),at:(+a.date||0)*1000})}catch(e){}}
    const review=k(2).map(a=>String(a.text||'').trim()).filter(Boolean).join('\n\n');
    const events=[...k(4).map(a=>({type:'progress',date:sec2d(+a.date),ts:(+a.date||0)*1000,page:+a.page||0})),...k(6).map(a=>({type:'rated',date:sec2d(+a.date),ts:(+a.date||0)*1000,rating:Math.max(0,Math.min(5,+j.rating||0))})),...k(2).map(a=>({type:'note',date:sec2d(+a.date),ts:(+a.date||0)*1000,text:String(a.text||'').trim()}))].filter(e=>e.date);
    let cover='',color='';const cf=byName[(j.uuid||name.replace(/\.book$/i,''))+'_i.png'];
    if(cf){try{const r=await imgToData(await cf.async('blob'),160,.78,true);cover=r.url;color=r.color}catch(e){}}
    out.push({title:String(j.title).trim(),author:bwAuthor(j.author),publisher:String(j.publisher||'').trim(),isbn:(v=>isbnOk(v)?cleanIsbn(v):'')(String(j.isbn||'').trim()),translator:String(j.translator||'').trim(),
      category:(c=>CAT_RENAME[c]||c)(String(j.category||'').trim()),pages,current,status,owned:false,format:'',rating:Math.max(0,Math.min(5,+j.rating||0)),startedAt,finishedAt,review,summary:'',quotes,
      readCount:+j.readCount||0,cover,events,color:color||COLORS[hash(j.title)%COLORS.length],createdAt:(+j.date||0)*1000,_ph:placeholder})}
  out.sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));return out}

async function runImport(){const r=buildImport();const now=Date.now();const writes=[];let added=0,merged=0;
  r.books.forEach((nb,i)=>{const ex=r.exist.get(bkey(nb.title,nb.author));
    if(ex){if(IMP.policy==='skip')return;const b={...ex};
      ['author','publisher','isbn','translator','category','cover','readCount','pages','current','rating','startedAt','finishedAt','review','summary','format'].forEach(f=>{if(!b[f]&&nb[f])b[f]=nb[f]});
      if(nb.events&&nb.events.length&&!(b.events||[]).length)b.events=nb.events;
      if(nb.sessions&&nb.sessions.length){const have=new Set((b.sessions||[]).map(x=>x.start));b.sessions=[...(b.sessions||[]),...nb.sessions.filter(x=>!have.has(x.start))]}
      [].forEach(f=>{if(!b[f]&&nb[f])b[f]=nb[f]});
      if(nb.owned)b.owned=true;if(ex.status==='want'&&nb.status!=='want')b.status=nb.status;
      const qk=q=>q.text||String(q.photo||'').slice(-60);const have=new Set((b.quotes||[]).map(qk));b.quotes=[...(b.quotes||[]),...nb.quotes.filter(q=>!have.has(qk(q))).map((q,j)=>({...q,id:uid()+j,at:q.at||now}))];
      b.updatedAt=now;writes.push(b);merged++}
    else{const b={...nb,id:uid(),quotes:nb.quotes.map((q,j)=>({...q,id:uid()+j,at:q.at||now-j})),color:nb.color||COLORS[hash(nb.title)%COLORS.length],
      createdAt:nb.createdAt||now-i,updatedAt:now,source:IMP.mode==='bw'?'bookswing':IMP.mode==='table'?'import':nrm(IMP.src)};delete b._i;delete b._ph;delete b._matched;writes.push(b);added++}});
  IMP.step='run';IMP.total=writes.length;IMP.done=0;renderImp();
  S.importing=true;writes.forEach(b=>{S.books[b.id]=b});saveLocal();
  let failed=0,quota=false;
  if(cloud){const q=writes.slice();const tick=()=>{IMP.done++;const bar=$('#impbar'),c=$('#impcnt');if(bar)bar.style.width=(IMP.done/IMP.total*100)+'%';if(c)c.textContent=IMP.done+' / '+IMP.total};
    const worker=async()=>{while(q.length&&!quota){const b=q.shift();let ok=false;
      for(let t=0;t<4&&!ok;t++){try{if(typeof FB!=='undefined'&&FB&&FB.st&&!FB.stOff)await offloadImages(b);await cloud.books.doc(b.id).set(JSON.parse(JSON.stringify(b)));ok=true}
        catch(e){if(e&&e.code==='quota_exceeded'){quota=true;break}if(e&&(e.code==='resource_exhausted'||e.code==='unavailable'))await new Promise(r=>setTimeout(r,800*(t+1)+Math.random()*400));else break}}
      if(!ok){failed++;if(!r.exist.has(bkey(b.title,b.author)))delete S.books[b.id]}tick()}};
    await Promise.all([worker(),worker(),worker()]);if(quota)q.forEach(b=>{failed++;if(!r.exist.has(bkey(b.title,b.author)))delete S.books[b.id]});saveLocal()}
  else{IMP.done=IMP.total}
  S.importing=false;S.synced=true;saveLocal();
  IMP.result={added:added-(failed>0?Math.min(failed,added):0),merged,failed,quota,local:!cloud};IMP.step='done';renderImp();renderMain();
}

async function aiMap(){if(!sample||IMP.aiBusy)return;IMP.aiBusy=true;renderImp();
  const rows=IMP.rows.slice(0,6).map(r=>Object.fromEntries(Object.entries(r).map(([k,v])=>[k,String(v instanceof Date?pDate(v):v).slice(0,80)])));
  const prompt=`독서 기록 앱의 백업 파일 열 이름과 예시 행입니다. 각 항목에 가장 알맞은 열 이름을 골라 JSON 객체 하나로만 답하세요. 맞는 열이 없으면 null.
항목: ${FIELDS.map(([f,l])=>f+'('+l+')').join(', ')}
열 이름: ${JSON.stringify(IMP.cols)}
예시 행: ${JSON.stringify(rows)}
형식 예: {"title":"열이름","author":null}`;
  try{const j=await sample.json(prompt,{modelTier:'quick'});const map={};for(const [f] of FIELDS){if(j&&typeof j[f]==='string'&&IMP.cols.includes(j[f]))map[f]=j[f]}
    if(map.title){IMP.map=map;toast('Claude가 칸을 맞췄어요. 미리보기를 확인해 주세요')}else toast('제목 칸을 찾지 못했어요. 직접 지정해 주세요')}
  catch(e){if(e&&e.code==='invalid_json')toast('결과를 읽지 못했어요. 직접 지정해 주세요');else aiFail(e)}
  IMP.aiBusy=false;renderImp()}

$('#imp').addEventListener('click',e=>{const t=e.target.closest('[data-iact]');if(!t)return;const a=t.dataset.iact;
  if(a==='manual'){IMP.mode='table';useSheet();IMP.step='map';renderImp();return}
  if(a==='close')closeImport();if(a==='pick')$('#impfile').click();if(a==='run')runImport();if(a==='ai')aiMap()});
$('#imp').addEventListener('change',e=>{const t=e.target;
  if(t.dataset.imap){IMP.map[t.dataset.imap]=t.value||undefined;if(!t.value)delete IMP.map[t.dataset.imap];renderImp();return}

  if(k==='sheet'){IMP.sheet=t.value;useSheet()}if(k==='split')IMP.split=t.checked;if(k==='policy')IMP.policy=t.value;
  const st=$('#imp').scrollTop;renderImp();$('#imp').scrollTop=st});

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
