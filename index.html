 --plank:#473D33;--plank-edge:#2C2620;--ribbon:#D6AE3A;color-scheme:dark;--gmd:#98B8E1;--shelf-bg:linear-gradient(180deg,#2E3238,#272B2F);
 --bg-ink:#E5E8EB;--bg-muted:#B0B6BF;--bg-accent:#98B8E1;--bg-shadow:none}
.today{margin:0 12px 10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;display:grid;grid-template-columns:48px 1fr 1fr 1fr;gap:12px;align-items:center;cursor:pointer}
.ringwrap{position:relative;width:48px;height:48px}
.ringwrap b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
.ring{width:48px;height:48px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5;stroke:var(--chip)}
.ring circle+circle{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .4s}
.today .tt b{display:block;font-family:var(--serif);font-size:15px;line-height:1.2;white-space:nowrap}
.today .tt span{font-size:11px;color:var(--muted)}
.qotd{margin:0 12px 14px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:14px;padding:12px 14px}
.qotd .qh{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.qotd .qbody{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px;text-align:left;display:block;cursor:pointer}
.qotd blockquote{margin:0;font-family:var(--serif);font-size:15px;line-height:1.7;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;text-align:left}
.qotd blockquote.clamp{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.qotd .qmore{display:block;margin:6px 0 0 auto}
.qotd .mhint{font-size:11px;color:var(--muted);margin-top:4px}
.qotd .meta{margin-top:6px;font-size:12px;color:var(--muted)}
.heat{display:grid;grid-template-columns:repeat(12,1fr);grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px}
.heat i{aspect-ratio:1;border-radius:2px;background:var(--chip)}
.heat i.l1{background:color-mix(in srgb,var(--accent) 35%,var(--chip))}.heat i.l2{background:color-mix(in srgb,var(--accent) 65%,var(--chip))}.heat i.l3{background:var(--accent)}.heat i.l-1{opacity:0}
.tl{padding:4px 2px}
.tli{display:grid;grid-template-columns:84px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.tli>span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
.tli p{margin:4px 0 0;font-family:var(--serif);white-space:pre-wrap;line-height:1.6}
.tli.finished b,.tli.started b{color:var(--accent)}
.tag{font-style:normal;color:var(--accent);font-size:12px}
.qitem .meta button.fav{color:var(--ribbon)}
.qacts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.qbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 12px;font-size:13px;min-height:34px}
.qbtn.fav{color:#8A6400;border-color:var(--ribbon);background:color-mix(in srgb,var(--ribbon) 18%,var(--surface))}
.qbtn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,var(--line));margin-left:auto}
.qedit textarea{width:100%;min-height:90px;border:1px solid var(--line);background:var(--surface);border-radius:10px;font-family:var(--serif);font-size:16px;line-height:1.7;padding:10px;resize:vertical}
.qedit .acts{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.qedit input{width:76px;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px 8px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.kv div{background:var(--surface-2);border-radius:10px;padding:10px;min-width:0}
.kv span{font-size:12px;color:var(--muted);display:block}
.kv b{font-family:var(--serif);font-size:14px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kv small{font-size:12px;color:var(--muted)}
.pbars{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;height:80px;align-items:end;border-bottom:1px solid var(--line)}
.pbars div{height:100%;display:flex;align-items:flex-end;justify-content:center}
.pbars i{display:block;width:70%;background:var(--accent);border-radius:2px 2px 0 0;min-height:2px;opacity:.85}
.hbar{display:grid;grid-template-columns:90px 1fr 28px;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.hbar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar div{height:8px;background:var(--chip);border-radius:4px;overflow:hidden}
.hbar i{display:block;height:100%;background:var(--accent)}
.hbar b{text-align:right;font-size:12px}
.timer{background:var(--surface-2);border-radius:12px;padding:12px}
.timer b[data-elapsed]{font-family:var(--serif);font-size:30px;line-height:1;display:block;margin:4px 0 10px;font-variant-numeric:tabular-nums}
.timer .fin label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.timer .fin input{width:90px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;font-family:var(--serif);font-size:18px}
.sess{margin-top:12px;font-size:13px}
.sess summary{cursor:pointer;color:var(--muted)}
.srec{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:6px 0;border-bottom:1px solid var(--line)}
.bulk{position:sticky;top:62px;z-index:4;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:0 12px 12px;padding:10px 12px}
.tile.sel .cv{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.tile.sel .cv::after{content:"✓";position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center}
.catrow{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.catrow:last-child{border-bottom:0}
.catrow span{flex:1}
.catrow small{color:var(--muted)}
:root[data-skin="forest"]{--dot:#B0BFBA;--bg0:#101916;--bg-img:none;--surface0:#21362F;--surface-20:#2B463D;--ink:#E5EBE9;--muted:#B0BFBA;--line0:#40685B;--accent:#89D2B4;--accent-ink:#12211C;--chip0:#34554A;

  --plank:#9F8CC2;--plank-edge:#6A5A8C;--ribbon:#F0A85A;color-scheme:light;--shelf-bg:linear-gradient(180deg,#F2EEF8,#FFFFFF)}
/* tone adjust */
:root{--tl:0%;--td:0%;--tw:0%;--tc:0%;--gmd:#4681DB}
:root[data-tone="1"]{--tl:7%}:root[data-tone="2"]{--tl:14%}:root[data-tone="-1"]{--td:7%}:root[data-tone="-2"]{--td:14%}
:root[data-warm="1"]{--tw:6%}:root[data-warm="2"]{--tw:12%}:root[data-warm="-1"]{--tc:6%}:root[data-warm="-2"]{--tc:12%}
:root{--bg:color-mix(in srgb,color-mix(in srgb,color-mix(in srgb,color-mix(in srgb,var(--bg0),#fff var(--tl)),#000 var(--td)),#F0A050 var(--tw)),#5090E0 var(--tc));
  --surface:color-mix(in srgb,color-mix(in srgb,color-mix(in srgb,color-mix(in srgb,var(--surface0),#fff var(--tl)),#000 var(--td)),#F0A050 var(--tw)),#5090E0 var(--tc));
  --surface-2:color-mix(in srgb,color-mix(in srgb,color-mix(in srgb,color-mix(in srgb,var(--surface-20),#fff var(--tl)),#000 var(--td)),#F0A050 var(--tw)),#5090E0 var(--tc));
  --chip:color-mix(in srgb,color-mix(in srgb,color-mix(in srgb,color-mix(in srgb,var(--chip0),#fff var(--tl)),#000 var(--td)),#F0A050 var(--tw)),#5090E0 var(--tc));
  --line:color-mix(in srgb,color-mix(in srgb,color-mix(in srgb,color-mix(in srgb,var(--line0),#fff var(--tl)),#000 var(--td)),#F0A050 var(--tw)),#5090E0 var(--tc))}
.tonerow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;margin:10px 0 14px;font-size:14px}
.tonerow input{grid-column:1 / -1;width:100%;accent-color:var(--accent);margin:0}
.tonerow b{text-align:right;font-size:13px;font-variant-numeric:tabular-nums}
.gcond{margin-top:10px}.gcond b{display:block;color:var(--ink);font-size:13px;margin-bottom:4px}.gcond ul{margin:0;padding-left:18px}.gcond li{margin:2px 0}
.lmeth{display:inline-block;background:var(--chip);color:var(--ink);border-radius:999px;padding:1px 9px;font-size:12px;margin-right:4px}
.lgf input{display:block;width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.sel{width:100%;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:15px;-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.field input#f-catnew{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 12px}
.catrow .qbtn{min-height:30px;padding:4px 10px;font-size:12px}
.catdot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--c);margin-right:7px;vertical-align:-1px;flex:none}
.clegend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;font-size:12px;color:var(--muted)}
.bkcard{display:flex;align-items:center;gap:10px;border-color:var(--ribbon)}
.bkcard>div:first-child{flex:1;min-width:0;font-size:14px}
.danger-zone{border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.danger-zone h2{color:var(--danger)}
.skins{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.skins button{border:2px solid transparent;border-radius:12px;padding:6px 4px 8px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--ink)}
.skins button[aria-pressed="true"]{border-color:var(--accent)}
.skins i{display:block;width:100%;height:34px;border-radius:7px;background:var(--sb);border-bottom:6px solid var(--sp);box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;overflow-x:hidden;background-color:var(--bg);background-image:var(--bg-img,none);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-appearance:none;appearance:none;white-space:normal;text-align:center}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:88px}
.appbar{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.iconbtn{width:38px;height:38px;flex:none;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;padding:0}
.iconbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.abrand{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left!important;color:var(--ink)}
.abrand b{font-family:var(--serif);font-weight:700;font-size:20px;letter-spacing:-.01em;white-space:nowrap}
.appbar .hbtns.acts{flex:none}
.pagesub{margin:0;padding:12px 20px 10px;font-size:13px;color:var(--muted)}
.sec[id]{scroll-margin-top:72px}
.dback{position:fixed;inset:0;z-index:30;background:rgba(10,14,20,.45);opacity:0;pointer-events:none;transition:opacity .2s}
.dback.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;z-index:31;width:min(300px,82vw);background:var(--surface);color:var(--ink);transform:translateX(-104%);visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s linear .28s;will-change:transform;padding:calc(10px + env(safe-area-inset-top,0px)) 0 calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;box-shadow:4px 0 24px rgba(0,0,0,.25);overflow-y:auto}
.drawer.open{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s}
.dtop{display:flex;align-items:center;gap:12px;padding:0 12px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
.dtop .dhead{padding:0;border:0;margin:0;min-width:0;flex:1}
.dtop .dhead b{font-size:21px;line-height:1.2;color:var(--accent);letter-spacing:-.01em}
.dhead{padding:0 20px 16px;border-bottom:1px solid var(--line);margin-bottom:6px}
.dlogo{width:40px;height:40px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.dlogo svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linejoin:round}
.dhead b{display:block;font-family:var(--serif);font-size:20px}
.dhead span{display:block;font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ditem{display:flex!important;align-items:center;gap:14px;width:100%;background:none;border:0;padding:13px 20px;font-size:15px;color:var(--ink);text-align:left!important}
.ditem svg{width:20px;height:20px;flex:none;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ditem:active{background:var(--surface-2)}
.ditem.danger,.ditem.danger svg{color:var(--danger);stroke:var(--danger)}
.dsep{height:1px;background:var(--line);margin:6px 20px}
.dfoot{margin-top:auto;padding:14px 20px 0;font-size:12px;color:var(--muted)}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:16px 20px 10px}
.top h1{font-family:var(--serif);font-weight:700;font-size:22px;line-height:1.2;margin:0;letter-spacing:-.01em}
.top .sub{color:var(--muted);font-size:13px;margin-top:4px;white-space:nowrap}
.top>div:first-child{flex:none}
.btn{border:0;border-radius:999px;padding:9px 14px;font-weight:600;font-size:14px;background:var(--accent);color:var(--accent-ink);white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.linkbtn{background:none;border:0;padding:6px 2px;color:var(--accent);font-weight:600;font-size:14px}

/* chips */
.chipwrap{position:relative}
.chipwrap::after{content:"";position:absolute;top:0;right:0;bottom:12px;width:40px;background:linear-gradient(90deg,transparent,var(--bg));pointer-events:none}
.chips{display:flex;gap:6px;padding:0 44px 12px 20px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:0;background:var(--chip);color:var(--ink);border-radius:999px;padding:6px 13px;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface)}

/* continue reading */
.cont{display:flex;gap:10px;overflow-x:auto;padding:2px 20px 16px;scroll-snap-type:x mandatory;scrollbar-width:none}
.cont::-webkit-scrollbar{display:none}
.ccard{flex:0 0 82%;scroll-snap-align:start;background:var(--surface);border-radius:14px;padding:12px;display:grid;grid-template-columns:74px 1fr;gap:14px;align-items:stretch;border:1px solid var(--line)}
.ccard .mini{width:74px;height:108px;border-radius:3px;background:var(--c);box-shadow:2px 2px 8px rgba(0,0,0,.25);align-self:center}
.ccard>div:last-child{display:flex;flex-direction:column;justify-content:center;min-width:0}
.ccard .t{font-family:var(--serif);font-weight:700;font-size:16px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;background:none;border:0;padding:0;text-align:left;width:100%}
.ccard .a{color:var(--muted);font-size:12px}
.bar{height:5px;background:var(--chip);border-radius:3px;overflow:hidden;margin:9px 0 6px}
.bar i{display:block;height:100%;background:var(--c,var(--accent))}
.crow{display:flex;flex-direction:column;align-items:stretch;font-size:12px;color:var(--muted);gap:8px}
.crow .hbtns{flex:none;flex-wrap:nowrap;width:100%;gap:6px;justify-content:flex-end}
.crow .hbtns .btn{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;height:28px;padding:0 10px;font-size:12px;font-weight:600;white-space:nowrap;border-radius:8px;line-height:1}
.crow .hbtns .btn.ghost{border:1.5px solid var(--accent);color:var(--accent)}
.ccard .t{line-height:1.3;max-height:2.6em}
.ccard .a{line-height:1.4;margin-top:2px}

/* shelf */
.shelf{margin:0 12px;padding:6px 10px 0;display:flex;flex-wrap:wrap;align-content:flex-start;
  background:repeating-linear-gradient(to bottom,transparent 0 184px,var(--plank) 184px 192px,var(--plank-edge) 192px 196px);
  background-color:var(--surface-2);border-radius:6px;min-height:196px}
.slot{height:196px;padding-bottom:12px;display:flex;align-items:flex-end;margin-right:3px;position:relative}
.spine{width:var(--w);height:var(--h);background:var(--c);color:#F6F3EC;border:0;border-radius:3px 3px 1px 1px;padding:12px 0;
  writing-mode:vertical-rl;font-family:var(--serif);font-weight:700;font-size:13px;line-height:1;letter-spacing:.02em;
  display:flex;align-items:center;justify-content:flex-start;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;position:relative;
  box-shadow:inset 3px 0 0 rgba(255,255,255,.14),inset -4px 0 0 rgba(0,0,0,.2);transition:transform .15s ease}
.spine::before,.spine::after{content:"";position:absolute;left:0;right:0;height:2px;background:rgba(255,255,255,.28)}
.spine::before{top:6px}.spine::after{bottom:6px}
.spine span{overflow:hidden;text-overflow:ellipsis;max-height:100%}
.spine:hover{transform:translateY(-4px)}
.slot.want .spine{opacity:.42;outline:1px dashed var(--muted);outline-offset:-1px}
.slot.reading::before{content:"";position:absolute;top:calc(196px - 12px - var(--h) - 9px);left:calc(var(--w) * .55);width:7px;height:14px;background:var(--ribbon);
  clip-path:polygon(0 0,100% 0,100% 100%,50% 75%,0 100%);z-index:1}
.cat{margin:0 0 18px}
.cath{display:flex;align-items:baseline;gap:8px;padding:6px 22px 8px}
.cath h2{margin:0;font-family:var(--serif);font-size:20px;font-weight:700}
.cath span{font-size:12px;color:var(--muted)}
.wood{margin:0 12px;background:var(--shelf-bg,linear-gradient(180deg,var(--surface-2),var(--surface)));border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.wood{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.wood::-webkit-scrollbar{display:none}
.srow{flex:0 0 100%;scroll-snap-align:start;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:end;padding:18px 16px 0;border-bottom:9px solid var(--plank);box-shadow:inset 0 -2px 0 var(--plank-edge);position:relative}
.srow::after{content:"";position:absolute;left:0;right:0;bottom:-9px;height:3px;background:var(--plank-edge);opacity:.6}
.tile{background:none;border:0;padding:0;display:block;width:100%;transition:transform .15s}
.tile:hover{transform:translateY(-3px)}
.tile .cv{position:relative;aspect-ratio:2/3;width:100%;display:flex;align-items:flex-end}
.tile .cv{justify-content:center}
.tile .cv img{width:auto;height:auto;max-width:100%;max-height:100%;border-radius:2px 4px 4px 2px;box-shadow:-1px 0 0 rgba(0,0,0,.15),3px -2px 8px rgba(0,0,0,.28);display:block}
.tile .gen{width:100%;height:100%;border-radius:2px 4px 4px 2px;display:block}
.tile .gen{background:var(--c);color:#F6F3EC;padding:12px 10px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;box-shadow:inset 5px 0 0 rgba(0,0,0,.18),3px -2px 8px rgba(0,0,0,.28)}
.tile .gen span{font-family:var(--serif);font-weight:700;font-size:14px;line-height:1.3;word-break:keep-all;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.tile .gen small{font-size:10px;opacity:.8;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tile .rib{position:absolute;top:-4px;right:10%;width:16px;height:30px;background:var(--ribbon);clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%);box-shadow:0 2px 3px rgba(0,0,0,.3)}
.tile .pg{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(0,0,0,.35);border-radius:0 0 4px 2px;overflow:hidden}
.tile .pg b{display:block;height:100%;background:var(--ribbon)}
.tile .rc{position:absolute;right:5px;bottom:8px;background:rgba(15,20,26,.78);color:#F6F3EC;font-size:11px;font-weight:600;padding:2px 6px;border-radius:999px;line-height:1.3}
.tile .rt.unr{opacity:.55}
.tile .tlb{position:absolute;left:-4px;top:-9px;z-index:2;display:flex;flex-direction:column;align-items:flex-start;gap:3px}
.tile .newb{background:var(--ribbon);color:#fff;font-size:10px;font-weight:700;letter-spacing:.04em;padding:2px 6px;border-radius:999px;line-height:1.3;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.tile.isnew .cv img,.tile.isnew .gen{outline:2px solid var(--ribbon);outline-offset:2px}
.tile .fm{margin-left:9px;background:rgba(15,20,26,.72);color:#F6F3EC;font-size:10px;font-weight:600;padding:2px 6px;border-radius:999px;line-height:1.3}
.tile .rt{position:absolute;left:5px;bottom:8px;background:rgba(15,20,26,.78);padding:2px 6px;border-radius:999px;line-height:1}
.sti{position:relative;display:inline-block;font-size:11px;line-height:1;letter-spacing:1px;vertical-align:middle;white-space:nowrap}
.sti .bg{color:rgba(255,255,255,.35)}
.pv .sti .bg,.hint .sti .bg{color:var(--line)}
.sti .fg{position:absolute;left:0;top:0;overflow:hidden;color:#F5D86B;white-space:nowrap}
.pv .sti .fg,.hint .sti .fg{color:var(--ribbon)}
.chip.star{letter-spacing:1px}
.chip.star[aria-pressed="true"]{color:#F5D86B}
.tile.wish .cv{opacity:.55}
.cath em{font-style:normal;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 8px;margin-left:auto}
.cat.pre .wood{background:repeating-linear-gradient(45deg,rgba(127,127,127,.12) 0 6px,transparent 6px 14px),var(--surface-2);border-style:dashed;border-color:var(--dot,var(--line))}
.cat.pre .srow{border-bottom-color:var(--line);box-shadow:inset 0 -2px 0 var(--muted)}
.cat.pre .srow::after{background:var(--muted);opacity:.35}
.dots{display:flex;justify-content:center;align-items:center;gap:10px;padding:9px 0 0}
.dwrap{max-width:204px;overflow:hidden;padding:4px 6px}
.dtrack{display:flex;gap:4px;transition:transform .25s ease;width:max-content}
.dot{width:8px;height:8px;border-radius:50%;border:0;padding:0;background:var(--dot,var(--muted));opacity:.55;transition:background .15s,transform .15s,opacity .15s;flex:none}
.dot.far{transform:scale(.55)}
.dot.on{background:var(--accent);opacity:1;transform:scale(1.3)}
.dn{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.dn b{color:var(--ink)}
.more{display:block;margin:10px auto 0;background:none;border:1px solid var(--line);border-radius:999px;padding:7px 16px;font-size:13px;color:var(--ink)}
.empty{padding:40px 24px;text-align:center;color:var(--muted)}
.empty p{margin:0 0 14px;font-family:var(--serif);font-size:18px;color:var(--ink)}
.legend{display:flex;gap:14px;padding:12px 22px 0;font-size:12px;color:var(--muted)}
.legend b{display:inline-block;width:8px;height:12px;border-radius:1px;margin-right:5px;vertical-align:-1px}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tabs button{background:none;border:0;padding:10px 0 12px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button[aria-current="page"]{color:var(--ink);font-weight:600}
.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}
.tabs button[aria-current="page"] svg{stroke:var(--gmd);stroke-width:2}
.tabs button[aria-current="page"]{color:var(--gmd)}

/* sections */
.sec{background:var(--surface);margin:0 12px 12px;border-radius:14px;padding:16px;border:1px solid var(--line)}
.sec h2{font-size:14px;font-weight:600;margin:0 0 10px;color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}

/* goal */
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:18px;line-height:1}
.stepper output{min-width:56px;white-space:nowrap;text-align:center;font-family:var(--serif);font-weight:700;font-size:22px}
.gshelf{display:flex;flex-wrap:wrap;gap:3px;align-items:flex-end;padding:10px 0 6px;border-bottom:4px solid var(--plank);margin-top:6px}
.gshelf i{width:12px;height:40px;border-radius:2px 2px 0 0;background:var(--c)}
.gshelf i.e{background:transparent;outline:1px dashed var(--line);outline-offset:-1px}
.gnote{margin-top:10px;font-family:var(--serif);font-size:17px}
.months{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;align-items:end;height:120px;border-bottom:1px solid var(--line)}
.months .m{display:flex;flex-direction:column-reverse;gap:2px;align-items:center;height:100%}
.months .m i{width:70%;height:14px;border-radius:2px;background:var(--c)}
.mlabels{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;font-size:11px;color:var(--muted);text-align:center;margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--surface-2);border-radius:10px;padding:10px}
.stats b{display:block;font-family:var(--serif);font-size:20px}
.stats span{font-size:12px;color:var(--muted)}

/* quotes */
.search{margin:0 20px 12px;display:block;width:calc(100% - 40px);border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}
.qcard{background:var(--surface);margin:0 12px 10px;border-radius:14px;padding:18px 18px 14px;border:1px solid var(--line);border-left:4px solid var(--c);text-align:left;display:block;cursor:pointer}
.qcard blockquote{margin:0;font-family:var(--serif);font-size:17px;line-height:1.75;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;text-align:left}
.qcard .meta{margin-top:10px;font-size:12px;color:var(--muted)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:10;background:var(--bg);overflow-y:auto;overflow-x:hidden;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.open{transform:none}
.sheet .in{max-width:480px;margin:0 auto;padding-bottom:40px}
.sbar{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--bg)}
.cover{margin:6px 20px 18px;background:var(--c);color:#F6F3EC;border-radius:4px 10px 10px 4px;padding:26px 22px 22px 30px;position:relative;min-height:170px;display:flex;flex-direction:column;justify-content:flex-end;
  box-shadow:inset 8px 0 0 rgba(0,0,0,.18),inset 10px 0 0 rgba(255,255,255,.1)}
.cover.has-img{flex-direction:row;align-items:flex-end;gap:16px;padding-left:24px}
.cover .cimg{width:92px;height:auto;max-height:136px;object-fit:cover;border-radius:2px;box-shadow:0 4px 12px rgba(0,0,0,.35);flex:none}
.cover .ctext{min-width:0}
.ccard img.mini{object-fit:cover}
.qphoto{display:block;max-width:100%;border-radius:8px;margin:2px 0 8px}
.cover2{margin:6px 16px 16px;display:flex;gap:16px;align-items:flex-start}
.cover2 .cvbox{flex:none;width:118px;border-radius:3px 7px 7px 3px;overflow:hidden;box-shadow:-1px 0 0 rgba(0,0,0,.15),4px 6px 16px rgba(0,0,0,.3)}
.cover2 .cvbox img{width:100%;height:auto;max-height:200px;object-fit:contain;display:block}
.cover2 .gen{width:100%;height:177px;background:var(--c);color:#F6F3EC;padding:14px 12px;box-shadow:inset 7px 0 0 rgba(0,0,0,.18),inset 9px 0 0 rgba(255,255,255,.1);display:flex;align-items:flex-end}
.cover2 .gen span{font-family:var(--serif);font-weight:700;font-size:15px;line-height:1.3;word-break:keep-all;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.cover2 .ctext{flex:1;min-width:0;padding-top:4px;overflow-wrap:anywhere}
.cover2 .ct{font-family:var(--serif);font-weight:700;font-size:19px;line-height:1.35;word-break:keep-all}
.cover2 .cs{font-family:var(--serif);font-size:13px;line-height:1.45;color:var(--muted);margin-top:4px;word-break:keep-all}
.cover2 .ca{font-size:13px;color:var(--ink);margin-top:10px;line-height:1.5}
.cover2 .ca2{font-size:12px;color:var(--muted);margin-top:4px}
.cover .ct{font-family:var(--serif);font-weight:700;font-size:26px;line-height:1.3;word-break:keep-all}
.cover .ca{margin-top:6px;font-size:14px;opacity:.85}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--chip);border-radius:10px;padding:3px;gap:3px}
.seg{background:transparent!important;padding:0!important;gap:6px!important}
.seg button{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:8px 0;font-size:13px;text-align:center}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.stars{position:relative;display:inline-block;font-size:28px;line-height:1;letter-spacing:2px;cursor:pointer;user-select:none;touch-action:manipulation}
.stars .bg{color:var(--line)}
.stars .fg{position:absolute;inset:0;overflow:hidden;color:var(--ribbon);white-space:nowrap;width:var(--p)}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}
.prog .nums{display:flex;align-items:baseline;gap:6px;font-size:14px;color:var(--muted)}
.prog input[type=number]{width:72px;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px 8px;font-family:var(--serif);font-size:18px;color:var(--ink)}
.prog input[type=range]{width:100%;accent-color:var(--accent);margin:12px 0 2px}
.dates{font-size:12px;color:var(--muted);margin-top:6px}
.dtabs{display:flex;gap:4px;padding:0 20px;margin:4px 0 10px;border-bottom:1px solid var(--line)}
.dtabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 10px;font-size:14px;color:var(--muted);margin-bottom:-1px}
.dtabs button[aria-selected="true"]{color:var(--ink);border-color:var(--ink);font-weight:600}
.panel{padding:0 12px}
textarea.note{display:block;width:100%;min-height:180px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;font-family:var(--serif);font-size:16px;line-height:1.8;resize:vertical}
.hint{font-size:12px;color:var(--muted);margin:8px 4px 0}
.qadd{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:14px}
.qadd textarea{width:100%;min-height:90px;border:0;background:transparent;font-family:var(--serif);font-size:16px;line-height:1.7;resize:vertical;padding:2px}
.qadd .acts{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.qadd input{width:76px;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px 8px}
.qitem{border-left:3px solid var(--c);padding:6px 0 6px 14px;margin:0 4px 16px}
.qitem blockquote{margin:0;font-family:var(--serif);font-size:16px;line-height:1.75;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.qitem .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px}
.qitem .meta button{background:none;border:0;color:var(--muted);font-size:12px;padding:0}

/* modal form */
.modal{position:fixed;inset:0;z-index:20;background:rgba(10,14,20,.45);display:flex;align-items:flex-end;justify-content:center}
.modal[hidden]{display:none}
.mbox{background:var(--surface);width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:18px 20px calc(20px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow-y:auto}
.mbox h3{font-family:var(--serif);font-size:20px;margin:4px 0 14px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.field input[type=text],.field input[type=number]{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 12px}
.srcrow{display:flex;gap:10px;align-items:center;font-size:12px;margin-top:4px}
.srcrow em{font-style:normal;color:var(--muted);background:var(--chip);border-radius:999px;padding:1px 7px}
.srcrow a{color:var(--accent);font-weight:600;text-decoration:none}
.addtabs{grid-template-columns:repeat(3,1fr)!important;margin:-4px 0 14px}
.addtabs button{font-size:12.5px;padding:8px 2px}
.sres{display:flex;flex-direction:column;gap:2px;margin:-4px 0 6px}
.srow2{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.srow2:last-child{border-bottom:0}
.sthumb{flex:none;width:48px;height:72px;border:0;padding:0;border-radius:2px 5px 5px 2px;overflow:hidden;background:var(--c);position:relative;box-shadow:1px 2px 6px rgba(0,0,0,.2)}
.sthumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:var(--surface-2)}
.sthumb span{position:absolute;inset:auto 4px 4px 4px;font-family:var(--serif);font-weight:700;font-size:8px;line-height:1.2;color:#F6F3EC;text-align:left;overflow:hidden;max-height:60px;word-break:keep-all}
.sbody{flex:1;min-width:0}
.stitle{background:none;border:0;padding:0;text-align:left;width:100%;display:block}
.stitle b{display:block;font-family:var(--serif);font-size:15px;line-height:1.35;word-break:keep-all;overflow-wrap:anywhere}
.stitle span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.stitle .sisbn{font-size:11px}
.srcrow{flex-wrap:wrap;gap:4px 10px!important}
.srcrow a.srcbadge{font-weight:500;color:var(--muted);background:var(--chip);border-radius:999px;padding:1px 8px;font-size:12px}
.pickednote{margin:0 0 12px;padding:8px 10px;border-radius:8px;background:color-mix(in srgb,var(--gmd) 12%,var(--surface));color:var(--ink);font-size:13px}
.coveredit{display:flex;gap:14px;align-items:flex-start}
.cethumb{flex:none;width:64px;height:96px;border-radius:3px 6px 6px 3px;overflow:hidden;background:var(--c);display:flex;align-items:flex-end;padding:6px;box-shadow:2px 3px 8px rgba(0,0,0,.25)}
.cethumb.has{padding:0;background:var(--surface-2)}
.cethumb img{width:100%;height:100%;object-fit:contain;display:block}
.cethumb span{font-family:var(--serif);font-weight:700;font-size:10px;line-height:1.25;color:#F6F3EC;word-break:keep-all;overflow:hidden;max-height:100%}
.ceside{flex:1;min-width:0}
.ceacts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:30px;height:30px;border-radius:50%;border:0;background:var(--c)}
.swatches button[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:2px}
.mact{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.err{color:var(--danger);font-size:13px;margin-top:4px}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;z-index:30;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13px;transition:all .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sync{font-size:11px;color:var(--muted);text-align:center;padding:18px 0 0}
.hbtns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;flex:1;min-width:0}
.btn.act{display:inline-flex;align-items:center;gap:5px;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.btn.act svg{stroke:currentColor}
.btn.act svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.act.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.act.selon{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.act.danger{color:var(--danger);border-color:var(--danger)}
.btn.act.danger svg{stroke:var(--danger)}
.hbtns.acts .btn.act{min-height:36px;padding:7px 12px;font-size:13px}
.top h1{white-space:nowrap}
.top h1.brand{font-size:24px;letter-spacing:-.01em}
.imp{position:fixed;inset:0;z-index:15;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.imp[hidden]{display:none}
.imp .in{max-width:480px;margin:0 auto;padding-bottom:40px}
.imp p{margin:0 0 10px}
.note-box{background:var(--surface-2);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--muted);line-height:1.6}
.maprow{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.maprow:last-child{border-bottom:0}
.maprow label{font-size:13px}
.maprow select{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:7px 8px;font-size:13px}
.maprow select.set{border-color:var(--accent)}
.pv{display:grid;grid-template-columns:8px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.pv:last-child{border-bottom:0}
.pv i{border-radius:2px;background:var(--c)}
.pv b{font-family:var(--serif);font-size:15px;display:block}
.pv span{color:var(--muted)}
.sumline{font-family:var(--serif);font-size:17px;line-height:1.6}
.radio{display:flex;flex-direction:column;gap:8px;font-size:14px}
.radio label{display:flex;gap:8px;align-items:flex-start}
.radio input{margin-top:4px;accent-color:var(--accent)}
.bigbar{height:8px;background:var(--chip);border-radius:4px;overflow:hidden;margin:14px 0 8px}
.bigbar i{display:block;height:100%;background:var(--accent);transition:width .2s}
.appbar .abrand{position:static;flex:1;min-width:0;display:flex;align-items:center;justify-content:center;text-align:center!important}
.appbar .abrand b{overflow:hidden;text-overflow:ellipsis}
.appbar .hbtns.acts{margin-left:auto}
.appbar .btn.act .lbl{display:none}
.appbar .hbtns.acts .btn.act{width:38px;height:38px;min-height:38px;padding:0;justify-content:center;gap:0}
.appbar .hbtns.acts .btn.act svg{width:18px;height:18px}
.appbar .btn.act.primary{background:var(--surface);color:var(--ink);border-color:var(--line)}
.appbar .abrand b{font-size:25px;font-weight:700;letter-spacing:-.02em;color:var(--accent);text-shadow:0 1px 0 color-mix(in srgb,var(--surface) 60%,transparent)}
.tabs{padding-bottom:max(4px,calc(env(safe-area-inset-bottom,0px) - 16px))}
.tabs button{padding:9px 0 7px;font-size:0;gap:0;line-height:0}
.tabs svg{width:26px;height:26px}
.app{padding-bottom:calc(64px + max(4px,calc(env(safe-area-inset-bottom,0px) - 16px)))}
.toast{bottom:calc(66px + env(safe-area-inset-bottom,0px))}
.fzone{margin:10px 12px 12px;padding:10px 0 2px;background:color-mix(in srgb,var(--surface) 55%,transparent);border:1px solid color-mix(in srgb,var(--line) 80%,transparent);border-radius:14px}
.fzone .chips{padding:0 36px 8px 10px;align-items:center}
.fzone .chipwrap::after{bottom:8px;width:32px;border-radius:0 14px 14px 0;background:linear-gradient(90deg,transparent,color-mix(in srgb,color-mix(in srgb,var(--surface) 55%,var(--bg)) 100%,transparent))}
.fzone .search{margin:0 10px 8px;width:calc(100% - 20px);padding:8px 12px}
.chip.ic{display:inline-flex;align-items:center;justify-content:center;padding:6px 10px}
.chip.ic svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.cdiv{flex:none;width:1px;height:20px;background:var(--line);margin:0 2px}
.dash{margin:0 12px 16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.dashh{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:10px 14px;text-align:left!important;color:var(--ink)}
.dmini{flex:none;width:22px;height:22px;border-radius:50%;background:conic-gradient(var(--accent) var(--p),var(--chip) 0);-webkit-mask:radial-gradient(circle,transparent 6px,#000 7px);mask:radial-gradient(circle,transparent 6px,#000 7px)}
.dsum{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;font-size:13px;color:var(--muted)}
.dsum b{font-family:var(--serif);font-size:15px;color:var(--ink)}
.dsum i{font-style:normal;white-space:nowrap}
.dbk{flex:none;font-style:normal;font-size:11px;font-weight:600;color:#fff;background:var(--ribbon);border-radius:999px;padding:2px 8px}
.dchev{flex:none;width:32px;height:32px;border-radius:50%;background:var(--chip);color:var(--ink);display:flex;align-items:center;justify-content:center;margin:-4px -4px -4px 0}
.dchev svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.dash.open .dchev svg{transform:rotate(180deg)}
.dashb{border-top:1px solid var(--line);padding:12px 0 2px}
.dashb .today,.dashb .qotd,.dashb .sec{margin-left:10px;margin-right:10px}
@media (hover:hover) and (pointer:fine){.chips{cursor:grab}.chips .chip{cursor:pointer}}
.tile.isnew .tlb{flex-direction:row;align-items:center;gap:4px;flex-wrap:wrap;right:-4px}
.tile.isnew .tlb .fm{margin-left:0}
.titem .newb{position:absolute;left:-4px;top:-7px;z-index:2;background:var(--ribbon);color:#fff;font-size:9.5px;font-weight:700;letter-spacing:.04em;padding:2px 6px;border-radius:999px;line-height:1.3;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.titem .tcv:has(.newb) img,.titem .tcv:has(.newb) .gen{outline:2px solid var(--ribbon);outline-offset:2px}
.rcard .gmini{display:flex;align-items:flex-end;padding:7px;box-shadow:inset 4px 0 0 rgba(0,0,0,.18),2px 2px 8px rgba(0,0,0,.25)}
.rcard .gmini span{font-family:var(--serif);font-weight:700;font-size:10px;line-height:1.25;color:#F6F3EC;word-break:keep-all;overflow:hidden;max-height:100%}
.rmeta{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 4px}
.dchip{background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:600;border-radius:999px;padding:2px 9px;line-height:1.4}
.sadd{font-size:12px!important;padding:0!important}
.ccard{overflow:hidden}
.ccard .a{display:flex;gap:4px;min-width:0;white-space:nowrap}
.ccard .a .au{overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.ccard .a .sd{flex:none}
.ccard .t{display:-webkit-box!important;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rmeta{flex-wrap:nowrap!important;overflow:hidden;white-space:nowrap}
.rdate{font-size:12px;color:var(--muted);align-self:center}
.rcat{background:var(--chip);color:var(--ink);font-size:11px;border-radius:999px;padding:2px 9px;line-height:1.4}
.rcard .crow .sti .bg{color:var(--line)}.rcard .crow .sti .fg{color:var(--ribbon)}
.tile .band{position:absolute;left:0;right:0;bottom:30px;z-index:1;background:rgba(15,20,26,.72);color:#F6F3EC;font-size:10.5px;font-weight:600;letter-spacing:.03em;text-align:center;padding:3px 4px;line-height:1.3;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.tile .dest{background:rgba(15,20,26,.82);color:#F6F3EC;font-size:10px;font-weight:600;padding:2px 6px;border-radius:999px;line-height:1.3}
.traysec .cath{align-items:center}
.trayic{width:18px;height:18px;flex:none;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round;align-self:center}
.tray{display:flex;gap:14px;overflow-x:auto;margin:0 12px;padding:14px 14px 12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
.tray::-webkit-scrollbar{display:none}
.titem{flex:0 0 84px;width:84px;min-width:0;max-width:84px;overflow:visible;scroll-snap-align:start;background:none;border:0;padding:0;text-align:left!important;color:var(--ink);display:flex;flex-direction:column;gap:3px}
.titem .tcv{position:relative;width:84px;height:126px;display:flex;align-items:flex-end;justify-content:center}
.titem .tcv img{max-width:100%;max-height:100%;border-radius:2px 4px 4px 2px;box-shadow:2px 3px 8px rgba(0,0,0,.25);display:block}
.titem .gen{width:100%;height:100%;border-radius:2px 4px 4px 2px;background:var(--c);color:#F6F3EC;padding:8px 7px;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:inset 4px 0 0 rgba(0,0,0,.18),2px 3px 8px rgba(0,0,0,.25)}
.titem .gen span{font-family:var(--serif);font-weight:700;font-size:11px;line-height:1.25;word-break:keep-all;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.titem .gen small{display:none}
.titem .rt{position:absolute;left:4px;bottom:4px;background:rgba(15,20,26,.78);padding:2px 5px;border-radius:999px;line-height:1}
.titem .rt .sti{font-size:9px}
.titem>b{font-size:12px;font-weight:600;line-height:1.3;margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all}
.titem>b,.titem>small{max-width:84px}
.titem>small{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titem.sel .tcv{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.shelfstart{display:flex;align-items:center;gap:10px;margin:30px 16px 14px}
.shelfstart::before,.shelfstart::after{content:"";flex:1;height:3px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--plank))}
.shelfstart::after{background:linear-gradient(90deg,var(--plank),transparent)}
.shelfstart span{font-family:var(--serif);font-weight:700;font-size:15px;color:var(--ink);letter-spacing:.02em}
.shelfstart small{font-size:12px;color:var(--muted)}
/* layout grid: outer 12px, inner 14px, title x 16px, section gap 24px */
.cath{padding:4px 16px 10px!important;align-items:center}
.cath h2{line-height:1.25}
.cont{padding:2px 12px 0!important;gap:10px!important;scroll-padding-inline:12px;margin-bottom:24px}
.ccard{flex:0 0 calc(100% - 52px)!important;height:168px;padding:14px!important;box-sizing:border-box;align-items:center!important}
.ccard>div:last-child{height:100%;justify-content:space-between!important}
.cat{margin:0 0 24px!important}
.fzone{padding:12px 0 4px!important}
.fzone .chips{padding-left:14px!important}
.fzone .search{margin:0 14px 8px!important;width:calc(100% - 28px)!important}
.dash{margin-bottom:24px!important}
.dashh{padding:12px 14px!important}
.dashb .today,.dashb .qotd,.dashb .sec{margin-left:14px!important;margin-right:14px!important}
.srow{padding:18px 14px 0!important}
.shelfstart{margin:8px 12px 18px!important}
.trayic{margin-right:-2px}
.tray{padding:14px!important;scroll-padding-inline:14px}
.tray::after{content:"";flex:0 0 1px}
.cont::after{content:"";flex:0 0 2px}
/* text placed directly on the page background */
:root{--bg-ink:var(--ink);--bg-muted:var(--muted);--bg-accent:var(--accent);--bg-shadow:none}
:root[data-skin="ocean"]{--bg-muted:#46607A;--bg-accent:#245A94}
.cath h2,.shelfstart span{color:var(--bg-ink);text-shadow:var(--bg-shadow)}
.cath span,.cath em,.shelfstart small,.legend,.sync,.pagesub,.dots .dn{color:var(--bg-muted)!important;text-shadow:var(--bg-shadow)}
.cath em{border-color:color-mix(in srgb,var(--bg-muted) 45%,transparent)!important}
.dots .dn b{color:var(--bg-ink)}
.trayic{stroke:var(--bg-accent)!important}
.appbar .abrand b{color:var(--bg-accent)!important;text-shadow:var(--bg-shadow)!important}
.dot{background:var(--bg-muted)!important}.dot.on{background:var(--bg-accent)!important}
/* format chip on tiles */
.tile .fm{background:rgba(255,255,255,.92)!important;color:#1B2430!important;font-size:10.5px!important;font-weight:700!important;padding:3px 7px!important;border:1px solid rgba(0,0,0,.25);box-shadow:0 1px 3px rgba(0,0,0,.35)}
.titem .tfm{position:absolute;right:-4px;top:-7px;z-index:2;background:rgba(255,255,255,.92);color:#1B2430;font-size:10px;font-weight:700;padding:2px 6px;border-radius:999px;line-height:1.3;border:1px solid rgba(0,0,0,.25);box-shadow:0 1px 3px rgba(0,0,0,.35)}
.optchips{display:flex;gap:8px;flex-wrap:wrap}
.optchips button{display:inline-flex;align-items:center;gap:5px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;font-size:14px}
.optchips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.optchips svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.lentnote{display:flex;align-items:center;gap:4px;margin-top:10px;padding:8px 12px;border-radius:10px;background:color-mix(in srgb,#C2410C 12%,var(--surface));font-size:13px}
.lentnote b{color:#C2410C}
.shelfdiv{margin:6px 12px 22px;height:4px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--plank) 12%,var(--plank) 88%,transparent);box-shadow:0 1px 0 color-mix(in srgb,var(--plank-edge) 60%,transparent)}
.shelfh{padding-bottom:12px!important}
.shelfh~.cat:not(.traysec) .cath h2{font-size:16.5px;font-weight:700}
.shelfh~.cat:not(.traysec) .cath{padding-top:0!important;padding-bottom:8px!important}
.ditem.on{background:color-mix(in srgb,var(--accent) 12%,transparent);font-weight:600}
.skg{margin:10px 2px 6px;font-size:12px;color:var(--muted);font-weight:600}
.skg:first-of-type{margin-top:0}
.skins{grid-template-columns:repeat(4,1fr)!important;gap:6px!important}
.skins button{font-size:10.5px!important;padding:5px 3px 7px!important;line-height:1.25}
.dver{display:block;margin-top:4px;font-size:11px;opacity:.8;font-variant-numeric:tabular-nums}
.cvbtn{background:none;border:0;padding:0;display:flex;align-items:center;justify-content:center;align-self:center;cursor:pointer}
.cvbtn:active .mini{transform:scale(.97)}
.loanin{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);border-left:4px solid var(--lc);background:color-mix(in srgb,var(--lc) 7%,var(--surface))}
.loanin .lt{font-size:12px;font-weight:700;color:var(--lc);width:100%}
.loanin input[type=text]{flex:1 1 150px;min-width:0;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:10px;padding:9px 11px}
.loanin .duel{margin:0!important}

function loadLocal(){try{const d=JSON.parse(localStorage.getItem(LS)||'null');if(d){S.books=d.books||{};S.settings={...S.settings,...(d.settings||{})};S.synced=!!d.synced}}catch(e){}}
function saveLocal(){const isData=v=>typeof v==='string'&&v.startsWith('data:');const lite=()=>{const o={};for(const k in S.books){const b={...S.books[k]};if(isData(b.cover))delete b.cover;b.quotes=(b.quotes||[]).filter(q=>!isData(q.photo));o[k]=b}return o};
  const put=books=>localStorage.setItem(LS,JSON.stringify({books,settings:S.settings,synced:S.synced}));
  try{put(cloud?lite():S.books)}catch(e){try{put(lite())}catch(e2){}}}
function onWriteErr(e){if(e&&e.code==='invalid_argument'){cloud=null;setSync('이 기기에만 저장 중');}else if(e&&e.code==='quota_exceeded'){toast('저장 공간이 가득 찼어요. 책이나 문구를 일부 삭제해 주세요')}}
const isDataUrl=v=>typeof v==='string'&&v.startsWith('data:');
async function upImg(path,dataUrl){const ref=FB.st.ref(path);const snap=await ref.putString(dataUrl,'data_url',{contentType:'image/jpeg',cacheControl:'public,max-age=31536000'});return await snap.ref.getDownloadURL()}
async function offloadImages(b){if(!FB||!FB.st||FB.stOff||!S.user)return b;const uid=S.user.uid;let ch=false;
  try{if(isDataUrl(b.cover)){b.cover=await upImg(`users/${uid}/covers/${b.id}.jpg`,b.cover);ch=true}
    for(const q of (b.quotes||[])){if(isDataUrl(q.photo)){q.photo=await upImg(`users/${uid}/photos/${b.id}_${q.id}.jpg`,q.photo);ch=true}}}
  catch(e){FB.stOff=true;logError('storage',e.code||e.message);toast('표지 저장소를 쓸 수 없어 표지는 기존 방식으로 저장해요')}
  if(ch){S.books[b.id]=b;saveLocal()}return b}
function cloudWrite(b){const go=x=>cloud.books.doc(x.id).set(JSON.parse(JSON.stringify(x))).catch(onWriteErr);
  if(FB&&FB.st&&!FB.stOff&&(isDataUrl(b.cover)||(b.quotes||[]).some(q=>isDataUrl(q.photo))))return offloadImages(b).then(go);return go(b)}
function putBook(b){b.updatedAt=Date.now();S.books[b.id]=b;saveLocal();if(cloud)cloudWrite(b)}
const timers={};
function putBookLater(b){S.books[b.id]=b;saveLocal();clearTimeout(timers[b.id]);timers[b.id]=setTimeout(()=>putBook(S.books[b.id]),700)}
function removeBook(id){const old=S.books[id];delete S.books[id];saveLocal();if(!cloud)return;
  if(FB){cloud.books.doc(id).set({id,deleted:true,updatedAt:Date.now()}).catch(onWriteErr);if(FB.st&&old){[old.cover,...(old.quotes||[]).map(q=>q.photo)].filter(u=>typeof u==='string'&&u.includes('firebasestorage')).forEach(u=>{try{FB.st.refFromURL(u).delete().catch(()=>{})}catch(e){}})}}
  else cloud.books.doc(id).delete().catch(onWriteErr)}
function putSettings(){saveLocal();if(cloud)cloud.settings.set({...S.settings}).catch(onWriteErr)}

async function attachFirestore(uid){const base=FB.db.collection('users').doc(uid);
  cloud={books:base.collection('books'),settings:base.collection('meta').doc('settings'),errors:base.collection('errors')};
  setSync('내 계정에 저장 중');
  const LSK='mybookshelf.lastSync.'+uid;let last=0;try{last=+localStorage.getItem(LSK)||0}catch(e){}
  if(last){try{const c=await cloud.books.get({source:'cache'});if(c.empty)last=0;else{const nb={};c.docs.forEach(d=>{const x=d.data();if(!x.deleted)nb[d.id]={...x}});S.books=nb;S.synced=true;renderSoon()}}catch(e){last=0}}
  let first=true,maxSeen=last;
  const q=last?cloud.books.where('updatedAt','>',last-5*60000):cloud.books;
  q.onSnapshot(snap=>{
    if(first&&!last){first=false;
      if(snap.empty&&!S.synced&&list().length){list().forEach(b=>cloudWrite(b));S.synced=true;saveLocal();return}
    }
    first=false;if(S.importing)return;S.synced=true;
    if(!last&&snap.docChanges().length===snap.size){const nb={};snap.docs.forEach(d=>{const x=d.data();if(!x.deleted)nb[d.id]={...x};maxSeen=Math.max(maxSeen,+x.updatedAt||0)});for(const k in timers){if(S.books[k]&&nb[k])nb[k]=S.books[k]}S.books=nb}
    else snap.docChanges().forEach(ch=>{const x=ch.doc.data(),id=ch.doc.id;maxSeen=Math.max(maxSeen,+x.updatedAt||0);if(timers[id])return;if(ch.type==='removed'){if(!last)delete S.books[id];return}if(x.deleted)delete S.books[id];else S.books[id]={...x}});
    if(!snap.metadata.hasPendingWrites&&!snap.metadata.fromCache){try{localStorage.setItem(LSK,String(maxSeen))}catch(e){}}
    saveLocal();migrateCats();renderSoon();
  },e=>{cloud=null;setSync('동기화 오류: '+(e.code||''));renderSoon()});
  cloud.settings.onSnapshot(s=>{if(s.exists){S.settings={...S.settings,...s.data()};applySkin();saveLocal();renderSoon()}},()=>{})}
async function initCloud(){
  if(!window.claude||!window.claude.use){if(!initFirebase())setSync('이 기기에만 저장 중');return}
  claude.use('downloads').then(d=>{dl=d;renderSoon()});
  claude.use('sample').then(async s=>{sample=s;if(s){try{const l=await s.limits();sampleImages=!!(l&&l.images)}catch(e){}}renderAll()});
  const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
  const id=user?await user.id():null;
  if(!db||!id){setSync('이 기기에만 저장 중');return}
  const base=db.doc('data/users/'+id+'/profile');
  cloud={books:base.collection('books'),settings:db.doc('data/users/'+id+'/settings'),errors:base.collection('errors')};
  setSync('내 계정에 저장 중');
  let first=true;
  cloud.books.onSnapshot(snap=>{
    if(first){first=false;
      if(snap.empty&&!S.synced&&list().length){list().forEach(b=>cloud.books.doc(b.id).set(JSON.parse(JSON.stringify(b))).catch(onWriteErr));S.synced=true;saveLocal();return}
    }
    S.synced=true;
    if(S.importing)return;
    const nb={};snap.docs.forEach(d=>{nb[d.id]={...d.data()}});
    for(const k in timers){if(S.books[k]&&nb[k])nb[k]=S.books[k]}
    S.books=nb;saveLocal();migrateCats();renderSoon();
  },()=>{cloud=null;setSync('이 기기에만 저장 중')});
  cloud.settings.onSnapshot(s=>{if(s.exists){S.settings={...S.settings,...s.data()};applySkin();saveLocal();renderSoon()}},()=>{});
}

function renderSoonNow(){const a=document.activeElement;if(a&&/INPUT|TEXTAREA/.test(a.tagName)&&a.type!=='file'){pendingRender=true;return}renderAll()}

function trayHTML(key,name,books){books=[...books].sort((a,b)=>(isNew(b)-isNew(a))||(isNew(a)&&isNew(b)?b.createdAt-a.createdAt:0));const ic=key==='__summary'||name==='요약본'?'<path d="M6 3h9l3 3v15H6z"/><path d="M9 10h6M9 14h6M9 18h4"/>':'<path d="M7 3h10v18l-5-4-5 4z"/>';

function sectionHTML(key,name,books,mixed,pre){if(pre)return trayHTML(key,name,books);S._recentSec=key==='__recent';const pages=[];for(let i=0;i<books.length;i+=3)pages.push(books.slice(i,i+3));

/* ---------- habits: daily goal, streak, heatmap, estimate ---------- */
const dailyCfg=()=>({unit:S.settings.dailyUnit||'min',target:+S.settings.dailyTarget||20,days:+S.settings.weeklyDays||5});
function dayMap(){const m={};list().forEach(b=>(b.sessions||[]).forEach(x=>{const d=x.date;if(!d)return;const o=m[d]||(m[d]={min:0,pages:0});o.min+=+x.minutes||0;o.pages+=Math.max(0,(+x.to||0)-(+x.from||0))}));return m}
const dayVal=(o,unit)=>o?(unit==='min'?o.min:o.pages):0;
const isRead=o=>!!o&&(o.min>0||o.pages>0);
function dstr(d){return ymd(d)}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function streak(m){let n=0;let d=new Date();if(!isRead(m[dstr(d)]))d=addDays(d,-1);while(isRead(m[dstr(d)])){n++;d=addDays(d,-1)}return n}
function bestStreak(m){const ds=Object.keys(m).filter(k=>isRead(m[k])).sort();let best=0,cur=0,prev=null;for(const k of ds){const d=new Date(k);cur=(prev&&(d-prev)/864e5===1)?cur+1:1;best=Math.max(best,cur);prev=d}return best}
function weekDays(m){const d=new Date();const dow=(d.getDay()+6)%7;let n=0;for(let i=0;i<=dow;i++)if(isRead(m[dstr(addDays(d,-i))]))n++;return n}
function estimate(b){if(!b.pages||b.status!=='reading')return'';const rem=b.pages-(b.current||0);if(rem<=0)return'';
  const m=dayMap();let pg=0;for(let i=0;i<7;i++){const o=m[dstr(addDays(new Date(),-i))];if(o)pg+=o.pages}
  if(pg<=0)return'';const days=Math.ceil(rem/(pg/7));return dstr(addDays(new Date(),days))}
function todayCardHTML(){const c=dailyCfg(),m=dayMap(),t=m[dstr(new Date())],v=dayVal(t,c.unit),p=Math.min(1,v/c.target),st=streak(m),wk=weekDays(m);
  const r=20,circ=2*Math.PI*r;
  return `<section class="today" data-action="tab" data-tab="goal" role="button" tabindex="0"><div class="ringwrap"><svg viewBox="0 0 48 48" class="ring" aria-hidden="true"><circle cx="24" cy="24" r="${r}"/><circle cx="24" cy="24" r="${r}" style="stroke-dasharray:${circ};stroke-dashoffset:${circ*(1-p)}"/></svg><b>${Math.round(p*100)}%</b></div>
    <div class="tt"><b>${v}${c.unit==='min'?'분':'쪽'} / ${c.target}${c.unit==='min'?'분':'쪽'}</b><span>오늘 목표 달성</span></div>
    <div class="tt"><b>${st}일</b><span>연속</span></div><div class="tt"><b>${wk}/${c.days}일</b><span>이번 주</span></div></section>`}
function heatmapHTML(){const c=dailyCfg(),m=dayMap();const end=new Date();const dow=(end.getDay()+6)%7;const start=addDays(end,-(dow+77));const cells=[];
  for(let i=0;i<84;i++){const d=addDays(start,i);const k=dstr(d);const o=m[k];const v=dayVal(o,c.unit);const lv=d>end?-1:!v?0:v>=c.target?3:v>=c.target/2?2:1;cells.push(`<i class="l${lv}" title="${k} ${v}${c.unit==='min'?'분':'쪽'}"></i>`)}

  Object.values(S.books).forEach(b=>{if((b.v||0)>=SCHEMA&&!CAT_RENAME[b.category]&&!SUMCATS[b.category])return;let ch=false;
  const n=CAT_RENAME[b.category];if(n){b.category=n;ch=true}

function doneInYear(y){return list().filter(b=>b.status==='done'&&(b.finishedAt||'').startsWith(String(y)))}
function sessionsIn(y){const out=[];list().forEach(b=>(b.sessions||[]).forEach(x=>{if((x.date||'').startsWith(String(y)))out.push({...x,book:b})}));return out}
function fmtMin(m){m=Math.round(m);return m>=60?`${Math.floor(m/60)}시간 ${m%60}분`:`${m}분`}
function vGoal(){
  const years=[...new Set([YEAR,...list().map(b=>+(b.finishedAt||'').slice(0,4)).filter(Boolean)])].sort((a,b)=>b-a);
  const y=S.year||YEAR,isCur=y===YEAR,g=S.settings.goal;
  const done=doneInYear(y).sort((a,b)=>(a.finishedAt||'').localeCompare(b.finishedAt||''));const doneByCat=done.slice().sort((a,b)=>{const ia=allCats().indexOf(a.category||''),ib=allCats().indexOf(b.category||'');return (ia<0?999:ia)-(ib<0?999:ib)});
  const slots=Math.max(g,done.length);
  const gs=Array.from({length:slots},(_,i)=>doneByCat[i]?`<i style="--c:${bc(doneByCat[i])}" title="${esc(doneByCat[i].title)}"></i>`:'<i class="e"></i>').join('');
  const left=g-done.length;
  const corder=c=>{const i=allCats().indexOf(c||'');return i<0?999:i};const months=Array.from({length:12},(_,m)=>done.filter(b=>+b.finishedAt.slice(5,7)===m+1).sort((a,b)=>corder(a.category)-corder(b.category)));
  const mpages=months.map(ms=>ms.reduce((s,b)=>s+(+b.pages||0),0)),mp=Math.max(1,...mpages);

  ${isCur?dailyGoalHTML():''}

      +`<div class="catrow" style="border-bottom:0;padding-top:12px"><input type="text" id="ncat" placeholder="새 분류 이름" style="flex:1;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:7px 10px"><button class="btn small" data-action="acat">추가</button></div><p class="hint">분류를 삭제하면 그 분류의 책은 미분류로 옮겨져요.</p>`})()}</div>

function goBack(){if(S.view!=='settings')return;S.view=S.prevView||'shelf';const y=S.prevScroll||0;S.prevView=null;S.prevScroll=0;renderMain();setTimeout(()=>window.scrollTo(0,y),0)}
/* iOS home-screen apps and Android turn an edge swipe / back button into history.back():

window.addEventListener('popstate',()=>{if(S.view!=='settings')return;if(S.drawer){closeDrawer();goBack()}else{openDrawer();try{history.pushState({mbsView:'settings'},'')}catch(e){}}});

(()=>{let sx=null,sy=0;document.addEventListener('touchstart',e=>{const t=e.touches[0];sx=(!S.drawer&&!S.openId&&!S.form&&t.clientX<32)?t.clientX:null;sy=t.clientY},{passive:true});
  document.addEventListener('touchend',e=>{if(sx==null)return;const t=e.changedTouches[0],dx=t.clientX-sx,dy=Math.abs(t.clientY-sy);sx=null;if(dx>70&&dy<dx*.6)openDrawer()},{passive:true})})();

/* ---------- book search: Google Books + Open Library (+ Claude fallback) ---------- */
async function fetchJSON(url,ms){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms||8000);try{const r=await fetch(url,{signal:c.signal});if(!r.ok)throw new Error('http '+r.status);return await r.json()}finally{clearTimeout(t)}}
const httpsify=u=>String(u||'').replace(/^http:\/\//,'https://').replace('&edge=curl','');
/* Kakao (Daum) book search: best coverage of books sold in Korea. REST key restricted to this app */
const KAKAO_KEY='d5f8ddd2bad450b079804e9c6b89d80d';
async function searchKakao(q,isIsbn){const c=new AbortController();const t=setTimeout(()=>c.abort(),8000);
  try{const r=await fetch('https://dapi.kakao.com/v3/search/book?size=10&query='+encodeURIComponent(q)+(isIsbn?'&target=isbn':''),{headers:{Authorization:'KakaoAK '+KAKAO_KEY},signal:c.signal});
    if(!r.ok)throw new Error('http '+r.status);const j=await r.json();
    return (j.documents||[]).map(d=>{const ids=String(d.isbn||'').split(/\s+/).filter(Boolean);const isbn=ids.find(x=>x.length===13&&isbnOk(x))||ids.find(x=>isbnOk(x))||'';
      return {title:d.title||'',author:(d.authors||[]).join(', '),translator:(d.translators||[]).join(', '),publisher:d.publisher||'',year:(d.datetime||'').slice(0,4),pages:0,isbn,
        cover:httpsify(d.thumbnail||'')||(isbn?`https://covers.openlibrary.org/b/isbn/${isbn}-M.jpg?default=false`:''),source:'카카오 책',link:httpsify(d.url||'')}}).filter(r=>r.title)}
  finally{clearTimeout(t)}}
async function searchGoogle(q,lang){const j=await fetchJSON('https://www.googleapis.com/books/v1/volumes?q='+encodeURIComponent(q)+'&maxResults=10&printType=books'+(lang?'&langRestrict='+lang:''));
  return (j.items||[]).map(it=>{const v=it.volumeInfo||{};const ids=v.industryIdentifiers||[];const i13=(ids.find(x=>x.type==='ISBN_13')||{}).identifier||'';const i10=(ids.find(x=>x.type==='ISBN_10')||{}).identifier||'';
    const isbn=isbnOk(i13)?i13:(isbnOk(i10)?i10:'');const il=v.imageLinks||{};
    return {title:v.subtitle?`${v.title} (${v.subtitle})`:(v.title||''),author:(v.authors||[]).join(', '),publisher:v.publisher||'',year:(v.publishedDate||'').slice(0,4),pages:+v.pageCount||0,isbn,
      cover:httpsify(il.thumbnail||il.smallThumbnail||'')||(isbn?`https://covers.openlibrary.org/b/isbn/${isbn}-M.jpg?default=false`:''),source:'Google Books',link:httpsify(v.infoLink||'')}}).filter(r=>r.title)}
async function searchOpenLib(q,isIsbn){const url=isIsbn?`https://openlibrary.org/search.json?isbn=${encodeURIComponent(q)}&limit=5`:`https://openlibrary.org/search.json?q=${encodeURIComponent(q)}&limit=8&fields=title,subtitle,author_name,publisher,first_publish_year,number_of_pages_median,isbn,cover_i,key`;
  const j=await fetchJSON(url);return (j.docs||[]).map(d=>{const isbn=(d.isbn||[]).find(x=>x.length===13&&isbnOk(x))||(d.isbn||[]).find(x=>isbnOk(x))||'';
    return {title:d.subtitle?`${d.title} (${d.subtitle})`:(d.title||''),author:(d.author_name||[]).slice(0,3).join(', '),publisher:(d.publisher||[])[0]||'',year:d.first_publish_year?String(d.first_publish_year):'',pages:+d.number_of_pages_median||0,isbn,
      cover:d.cover_i?`https://covers.openlibrary.org/b/id/${d.cover_i}-M.jpg`:(isbn?`https://covers.openlibrary.org/b/isbn/${isbn}-M.jpg?default=false`:''),source:'Open Library',link:d.key?'https://openlibrary.org'+d.key:''}}).filter(r=>r.title)}
function mergeRes(a,b){const seen=new Set(a.map(r=>r.isbn||nrm(r.title)+'|'+nrm(r.author)));return a.concat(b.filter(r=>{const k=r.isbn||nrm(r.title)+'|'+nrm(r.author);if(seen.has(k))return false;seen.add(k);return true}))}
async function claudeSearch(q){const cats=[...new Set(list().map(b=>b.category).filter(Boolean))];
  const j=await sample.json(`사용자가 독서 앱에 책을 추가하려고 검색합니다. 검색어: "${q}"
실제로 존재한다고 확신하는 책만 최대 5권 골라 JSON 배열로만 답하세요. 각 항목: {"title":"정식 제목(부제 제외)","author":"저자","publisher":"출판사 또는 null","year":출판연도 숫자 또는 null,"pages":확신할 때만 쪽수 숫자 아니면 null}.
${lang()==='en'?'제목과 저자는 영어로 쓰세요.':'한국어 번역서는 한국어 제목과 한국어 표기 저자명을 쓰세요.'} 확실하지 않은 책은 넣지 말고, 전혀 모르면 빈 배열 []을 답하세요.`,{modelTier:'default',cache:false});
  return (Array.isArray(j)?j:[]).filter(r=>r&&r.title).slice(0,5).map(r=>({title:r.title,author:r.author||'',publisher:r.publisher||'',year:r.year?String(r.year):'',pages:+r.pages||0,isbn:'',cover:'',source:'Claude 지식',link:''}))}

async function fillPages(f,isbn){f.pagesBusy=true;renderForm();let n=0;
  try{const g=await searchGoogle('isbn:'+isbn);n=(g.find(r=>r.pages)||{}).pages||0}catch(e){}
  if(!n){try{const o=await searchOpenLib(isbn,true);n=(o.find(r=>r.pages)||{}).pages||0}catch(e){}}
  if(S.form!==f)return;f.pagesBusy=false;if(n&&!f.pages){f.pages=n;f.pagesAuto=true}renderForm()}
async function bookSearch(){const f=S.form;if(!f)return;const q=(f.q||'').trim();if(!q||f.searching)return;f.searching=true;f.results=null;renderForm();
  const isb=cleanIsbn(q);const isIsbn=/^[\d\-\sXx]+$/.test(q)&&(isb.length===13||isb.length===10)&&isbnOk(isb);let res=[];
  const ko=!isIsbn&&/[가-힣]/.test(q);
  const go=(k,fn)=>srcOn(k)?fn().catch(e=>{logError('search-'+k,e.message);return []}):Promise.resolve([]);
  const [kk,gg,oo]=await Promise.all([go('kakao',()=>searchKakao(isIsbn?isb:q,isIsbn)),go('google',()=>searchGoogle(isIsbn?'isbn:'+isb:q,ko?'ko':'')),go('openlib',()=>searchOpenLib(isIsbn?isb:q,isIsbn))]);
  /* Korean or ISBN query: Kakao 8, Google 4, Open Library 2; English query: Google 8, Kakao 4, Open Library 2; then the rest */
  /* Korean query: within Google and Open Library lists, Korean titles go first */
  const isK=r=>/[가-힣]/.test(r.title+r.author);const hk=l=>ko?[...l.filter(isK),...l.filter(r=>!isK(r))]:l;
  const order=(ko||isIsbn)?[[kk,8],[hk(gg),4],[hk(oo),2]]:[[gg,8],[kk,4],[oo,2]];
  for(const [l,n] of order)res=mergeRes(res,l.slice(0,n));for(const [l,n] of order)res=mergeRes(res,l.slice(n));
  if(!res.length&&sample){try{res=await claudeSearch(q)}catch(e){aiFail(e)}}
  if(S.form!==f)return;f.results=res.slice(0,14);f.searchedQ=q;f.searching=false;renderForm()}

async function aiSummary(){const b=S.books[S.openId];if(!b||!sample)return;

  const quotes=(b.quotes||[]).filter(q=>q.text).map(q=>`- ${q.fav?'[★] ':''}${q.text}${q.page?` (p.${q.page})`:''}${(q.tags||[]).length?` #${q.tags.join(' #')}`:''}`).join('\n')||'(없음)';
  const notes=[...(b.sessions||[]).filter(x=>x.note).map(x=>({d:x.date,t:x.note,k:'세션 메모'})),...(b.events||[]).filter(x=>x.type==='note'&&x.text).map(x=>({d:x.date,t:x.text,k:'메모'}))].sort((a,c)=>(a.d||'').localeCompare(c.d||'')).map(x=>`- ${x.d} (${x.k}): ${x.t}`).join('\n')||'(없음)';

  const prompt=`다음은 한 독자가 읽은 책에 대한 기록입니다. 이 기록을 바탕으로 책 요약 초안을 ${lang()==='en'?'영어로':'한국어로'} 작성해 주세요.

제목: ${b.title}
저자: ${b.author||'미상'}
분류: ${b.category||'(없음)'}
독서 기간과 세션: ${period}
독자 리뷰: ${b.review||'(없음)'}

${quotes}
읽으면서 남긴 메모(날짜순):
${notes}`;
  try{const {text}=await sample(prompt,{onText:({text})=>{box.value=text}});box.value=text;b.summary=text;putBook(b);toast('요약 초안을 넣었어요. 자유롭게 고쳐 쓰세요')}

async function shrink(file){const img=await createImageBitmap(file);const m=1600,s=Math.min(1,m/Math.max(img.width,img.height));
  const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return await new Promise(r=>c.toBlob(r,'image/jpeg',.85))}

function autoMap(cols){const cands=[];
  for(const [f] of FIELDS)for(const c of cols){const n=nrm(c),short=nrm(String(c).split('.').pop());
    for(const k of KEYS[f]){if(n===k||short===k)cands.push([f,c,1000+k.length]);else if(n.includes(k))cands.push([f,c,k.length])}}
  cands.sort((a,b)=>b[2]-a[2]);const map={},used=new Set();
  for(const [f,c] of cands){if(map[f]||used.has(c))continue;map[f]=c;used.add(c)}return map}

function decode(buf){try{return new TextDecoder('utf-8',{fatal:true}).decode(buf).replace(/^\uFEFF/,'')}catch(e){return new TextDecoder('euc-kr').decode(buf)}}
function parseCSV(text){const first=text.split(/\r?\n/).find(l=>l.trim())||'';
  const d=['\t',',',';','|'].map(x=>[x,first.split(x).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=ch}
    else if(ch==='"')q=true;else if(ch===d){row.push(cell);cell=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell=''}else cell+=ch}
  if(cell||row.length){row.push(cell);rows.push(row)}
  const body=rows.filter(r=>r.some(c=>String(c).trim()));if(!body.length)return[];
  const seen={};const head=body[0].map((h,i)=>{h=String(h).trim()||('열'+(i+1));seen[h]=(seen[h]||0)+1;return seen[h]>1?h+' ('+seen[h]+')':h});
  return body.slice(1).map(r=>Object.fromEntries(head.map((h,i)=>[h,r[i]??''])))}
function flat(o,p='',out={}){for(const k in o){const v=o[k];
  if(v&&typeof v==='object'&&!Array.isArray(v)&&!(v instanceof Date))flat(v,p+k+'.',out);
  else if(Array.isArray(v))out[p+k]=v.map(x=>x&&typeof x==='object'?Object.values(x).filter(y=>typeof y!=='object').join(' / '):x).join('\n\n');
  else out[p+k]=v}return out}

async function readImportFile(file){
  const ext=(file.name.split('.').pop()||'').toLowerCase();const buf=await file.arrayBuffer();const sheets={};
  if(ext==='xlsx'||ext==='xls'){const X=await loadXLSX();const wb=X.read(buf,{type:'array',cellDates:true});
    for(const n of wb.SheetNames){const r=X.utils.sheet_to_json(wb.Sheets[n],{defval:'',raw:true});if(r.length)sheets[n]=r}}
  else{const text=decode(buf);const t=text.trim();
    if(t.startsWith('{')||t.startsWith('[')){const j=JSON.parse(t);for(const [n,arr] of findArrays(j))sheets[n]=arr.map(x=>flat(x))}
    else{const r=parseCSV(text);if(r.length)sheets['데이터']=r}}
  return sheets}
