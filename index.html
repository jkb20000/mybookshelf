<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MyBookShelf</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2B2F6B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MyBookShelf">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg0:#E7EAEE; --surface0:#FFFFFF; --surface-20:#F3F5F7; --ink:#1B2430; --muted:#5D6774; --line0:#CCD3DA;
  --accent:#3D5A80; --accent-ink:#FFFFFF; --chip0:#DCE1E7;
  --plank:#B49C7E; --plank-edge:#8E7558; --ribbon:#E2B93B; --danger:#A33A3A;
  --serif:"Gowun Batang", "Noto Serif KR", "Batang", serif;
  --sans:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg0:#12161B; --surface0:#1B2128; --surface-20:#222932; --ink:#E5E9EE; --muted:#9AA4AF; --line0:#2E3740;
    --accent:#93B3DB; --accent-ink:#0F1620; --chip0:#262E37;
    --plank:#5A4A39; --plank-edge:#3A2F24; --ribbon:#D6AE3A; --danger:#E07B7B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg0:#12161B; --surface0:#1B2128; --surface-20:#222932; --ink:#E5E9EE; --muted:#9AA4AF; --line0:#2E3740;
  --accent:#93B3DB; --accent-ink:#0F1620; --chip0:#262E37;
  --plank:#5A4A39; --plank-edge:#3A2F24; --ribbon:#D6AE3A; --danger:#E07B7B;
  color-scheme:dark;
}
/* skins */
:root[data-skin="wood"]{--dot:#8E6B45;--bg0:#D8BD95;--bg-img:repeating-linear-gradient(92deg,rgba(90,50,20,.08) 0 2px,transparent 2px 9px,rgba(90,50,20,.05) 9px 11px,transparent 11px 23px,rgba(90,50,20,.09) 23px 24px,transparent 24px 41px);
  --surface0:#FBF5EA;--surface-20:#F2E7D3;--ink:#3A2816;--muted:#7B624E;--line0:#D9C3A2;--accent:#7A4A1E;--accent-ink:#FFF8EC;--chip0:#EBD8B9;
  --plank:#8E5E2E;--plank-edge:#5B3917;--ribbon:#D9342B;color-scheme:light;
  --shelf-bg:repeating-linear-gradient(91deg,rgba(90,50,20,.10) 0 2px,transparent 2px 8px,rgba(90,50,20,.06) 8px 10px,transparent 10px 21px,rgba(90,50,20,.11) 21px 22px,transparent 22px 37px),linear-gradient(180deg,#E6CA9F,#D5B585)}
:root[data-skin="walnut"]{--dot:#C9A77C;--bg0:#3A291C;--bg-img:repeating-linear-gradient(90deg,rgba(255,220,170,.035) 0 1px,transparent 1px 6px,rgba(255,220,170,.02) 6px 7px,transparent 7px 17px);
  --surface0:#4C3829;--surface-20:#574130;--ink:#F3E7D3;--muted:#CDB89C;--line0:#6E5542;--accent:#E3B874;--accent-ink:#2A1A0E;--chip0:#5F4835;
  --plank:#2A1A0E;--plank-edge:#1A0F06;--ribbon:#E04A3F;color-scheme:dark;
  --shelf-bg:repeating-linear-gradient(90deg,rgba(255,220,170,.05) 0 1px,transparent 1px 7px,rgba(255,220,170,.03) 7px 8px,transparent 8px 19px),linear-gradient(180deg,#6F4C2F,#5C3C23)}
:root[data-skin="linen"]{--dot:#9C9484;--bg0:#F3F0E8;--bg-img:none;--surface0:#FFFFFF;--surface-20:#F7F4EC;--ink:#2B2A26;--muted:#6E6A62;--line0:#DDD7CA;--accent:#2F5D50;--accent-ink:#FFFFFF;--chip0:#E7E2D5;
  --plank:#BFA98B;--plank-edge:#8C7658;--ribbon:#E2B93B;color-scheme:light;--shelf-bg:linear-gradient(180deg,#F7F4EC,#FFFFFF)}
:root[data-skin="slate"]{--dot:#8A96A3;--bg0:#E7EAEE;--bg-img:none;--surface0:#FFFFFF;--surface-20:#F3F5F7;--ink:#1B2430;--muted:#5D6774;--line0:#CCD3DA;--accent:#3D5A80;--accent-ink:#FFFFFF;--chip0:#DCE1E7;
  --plank:#B49C7E;--plank-edge:#8E7558;--ribbon:#E2B93B;color-scheme:light;--shelf-bg:linear-gradient(180deg,#F3F5F7,#FFFFFF)}
:root[data-skin="night"]{--dot:#6E7A87;--bg0:#12161B;--bg-img:none;--surface0:#1B2128;--surface-20:#222932;--ink:#E5E9EE;--muted:#9AA4AF;--line0:#2E3740;--accent:#93B3DB;--accent-ink:#0F1620;--chip0:#262E37;
  --plank:#5A4A39;--plank-edge:#3A2F24;--ribbon:#D6AE3A;color-scheme:dark;--shelf-bg:linear-gradient(180deg,#222932,#1B2128)}
.today{margin:0 12px 10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;display:grid;grid-template-columns:48px 1fr 1fr 1fr;gap:12px;align-items:center;cursor:pointer}
.ring{width:48px;height:48px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5;stroke:var(--chip)}
.ring circle+circle{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .4s}
.today .tt b{display:block;font-family:var(--serif);font-size:15px;line-height:1.2;white-space:nowrap}
.today .tt span{font-size:11px;color:var(--muted)}
.qotd{margin:0 12px 14px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:14px;padding:12px 14px}
.qotd .qh{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.qotd .qbody{background:none;border:0;padding:4px 0 0;text-align:left;width:100%}
.qotd blockquote{margin:0;font-family:var(--serif);font-size:15px;line-height:1.7;white-space:pre-wrap;max-height:9.5em;overflow-y:auto;overscroll-behavior:contain;padding-right:6px;-webkit-mask-image:linear-gradient(180deg,#000 calc(100% - 18px),transparent);mask-image:linear-gradient(180deg,#000 calc(100% - 18px),transparent)}
.qotd .meta{margin-top:6px;font-size:12px;color:var(--muted)}
.heat{display:grid;grid-template-columns:repeat(12,1fr);grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px}
.heat i{aspect-ratio:1;border-radius:2px;background:var(--chip)}
.heat i.l1{background:color-mix(in srgb,var(--accent) 35%,var(--chip))}.heat i.l2{background:color-mix(in srgb,var(--accent) 65%,var(--chip))}.heat i.l3{background:var(--accent)}.heat i.l-1{opacity:0}
.tl{padding:4px 2px}
.tli{display:grid;grid-template-columns:84px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.tli>span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
.tli p{margin:4px 0 0;font-family:var(--serif);white-space:pre-wrap;line-height:1.6}
.tli.finished b,.tli.started b{color:var(--accent)}
.tag{font-style:normal;color:var(--accent);font-size:12px}
.qitem .meta button.fav{color:var(--ribbon)}
.qacts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.qbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 12px;font-size:13px;min-height:34px}
.qbtn.fav{color:#8A6400;border-color:var(--ribbon);background:color-mix(in srgb,var(--ribbon) 18%,var(--surface))}
.qbtn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,var(--line));margin-left:auto}
.qedit textarea{width:100%;min-height:90px;border:1px solid var(--line);background:var(--surface);border-radius:10px;font-family:var(--serif);font-size:16px;line-height:1.7;padding:10px;resize:vertical}
.qedit .acts{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.qedit input{width:76px;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px 8px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.kv div{background:var(--surface-2);border-radius:10px;padding:10px;min-width:0}
.kv span{font-size:12px;color:var(--muted);display:block}
.kv b{font-family:var(--serif);font-size:14px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kv small{font-size:12px;color:var(--muted)}
.pbars{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;height:80px;align-items:end;border-bottom:1px solid var(--line)}
.pbars div{height:100%;display:flex;align-items:flex-end;justify-content:center}
.pbars i{display:block;width:70%;background:var(--accent);border-radius:2px 2px 0 0;min-height:2px;opacity:.85}
.hbar{display:grid;grid-template-columns:90px 1fr 28px;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.hbar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar div{height:8px;background:var(--chip);border-radius:4px;overflow:hidden}
.hbar i{display:block;height:100%;background:var(--accent)}
.hbar b{text-align:right;font-size:12px}
.timer{background:var(--surface-2);border-radius:12px;padding:12px}
.timer b[data-elapsed]{font-family:var(--serif);font-size:30px;line-height:1;display:block;margin:4px 0 10px;font-variant-numeric:tabular-nums}
.timer .fin label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.timer .fin input{width:90px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;font-family:var(--serif);font-size:18px}
.sess{margin-top:12px;font-size:13px}
.sess summary{cursor:pointer;color:var(--muted)}
.srec{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:6px 0;border-bottom:1px solid var(--line)}
.bulk{position:sticky;top:0;z-index:4;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:0 12px 12px;padding:10px 12px}
.tile.sel .cv{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.tile.sel .cv::after{content:"✓";position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center}
.catrow{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.catrow:last-child{border-bottom:0}
.catrow span{flex:1}
.catrow small{color:var(--muted)}
:root[data-skin="forest"]{--dot:#8FB3A5;--bg0:#1F3A33;--bg-img:none;--surface0:#2A4A41;--surface-20:#325449;--ink:#E6EFEA;--muted:#A9C0B6;--line0:#3F6256;--accent:#8FD1B5;--accent-ink:#0F2A22;--chip0:#3A5B50;
  --plank:#5C4632;--plank-edge:#3A2B1C;--ribbon:#F0C14B;color-scheme:dark;--shelf-bg:linear-gradient(180deg,#35584D,#2A4A41)}
:root[data-skin="ocean"]{--dot:#7F9AB5;--bg0:#E3EEF7;--bg-img:none;--surface0:#FFFFFF;--surface-20:#EFF5FA;--ink:#16324A;--muted:#5A7389;--line0:#C6D7E6;--accent:#3B7BBF;--accent-ink:#FFFFFF;--chip0:#D7E5F1;
  --plank:#8FA8BF;--plank-edge:#5F7A93;--ribbon:#F08A3C;color-scheme:light;--shelf-bg:linear-gradient(180deg,#EAF2F9,#FFFFFF)}
:root[data-skin="lavender"]{--dot:#9A8AB8;--bg0:#ECE7F4;--bg-img:none;--surface0:#FFFFFF;--surface-20:#F4F0FA;--ink:#2E2640;--muted:#6E6480;--line0:#D6CCE6;--accent:#6F5BA8;--accent-ink:#FFFFFF;--chip0:#E2D9EF;
  --plank:#9F8CC2;--plank-edge:#6A5A8C;--ribbon:#F0A85A;color-scheme:light;--shelf-bg:linear-gradient(180deg,#F2EEF8,#FFFFFF)}
/* tone adjust */
:root{--tl:0%;--td:0%;--tw:0%;--tc:0%}
:root[data-tone="1"]{--tl:7%}:root[data-tone="2"]{--tl:14%}:root[data-tone="-1"]{--td:7%}:root[data-tone="-2"]{--td:14%}
:root[data-warm="1"]{--tw:6%}:root[data-warm="2"]{--tw:12%}:root[data-warm="-1"]{--tc:6%}:root[data-warm="-2"]{--tc:12%}
:root{--bg:color-mix(in srgb,color-mix(in srgb,color-mix(in srgb,color-mix(in srgb,var(--bg0),#fff var(--tl)),#000 var(--td)),#F0A050 var(--tw)),#5090E0 var(--tc));
  --surface:color-mix(in srgb,color-mix(in srgb,color-mix(in srgb,color-mix(in srgb,var(--surface0),#fff var(--tl)),#000 var(--td)),#F0A050 var(--tw)),#5090E0 var(--tc));
  --surface-2:color-mix(in srgb,color-mix(in srgb,color-mix(in srgb,color-mix(in srgb,var(--surface-20),#fff var(--tl)),#000 var(--td)),#F0A050 var(--tw)),#5090E0 var(--tc));
  --chip:color-mix(in srgb,color-mix(in srgb,color-mix(in srgb,color-mix(in srgb,var(--chip0),#fff var(--tl)),#000 var(--td)),#F0A050 var(--tw)),#5090E0 var(--tc));
  --line:color-mix(in srgb,color-mix(in srgb,color-mix(in srgb,color-mix(in srgb,var(--line0),#fff var(--tl)),#000 var(--td)),#F0A050 var(--tw)),#5090E0 var(--tc))}
.tonerow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;margin:10px 0 14px;font-size:14px}
.tonerow input{grid-column:1 / -1;width:100%;accent-color:var(--accent);margin:0}
.tonerow b{text-align:right;font-size:13px;font-variant-numeric:tabular-nums}
.skins{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.skins button{border:2px solid transparent;border-radius:12px;padding:6px 4px 8px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--ink)}
.skins button[aria-pressed="true"]{border-color:var(--accent)}
.skins i{display:block;width:100%;height:34px;border-radius:7px;background:var(--sb);border-bottom:6px solid var(--sp);box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background-color:var(--bg);background-image:var(--bg-img,none);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:88px}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:22px 20px 14px}
.top h1{font-family:var(--serif);font-weight:700;font-size:28px;line-height:1.2;margin:0;letter-spacing:-.01em}
.top .sub{color:var(--muted);font-size:13px;margin-top:4px}
.btn{border:0;border-radius:999px;padding:9px 14px;font-weight:600;font-size:14px;background:var(--accent);color:var(--accent-ink);white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.linkbtn{background:none;border:0;padding:6px 2px;color:var(--accent);font-weight:600;font-size:14px}

/* chips */
.chips{display:flex;gap:6px;padding:0 20px 12px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:0;background:var(--chip);color:var(--ink);border-radius:999px;padding:6px 13px;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* continue reading */
.cont{display:flex;gap:10px;overflow-x:auto;padding:2px 20px 16px;scroll-snap-type:x mandatory;scrollbar-width:none}
.cont::-webkit-scrollbar{display:none}
.ccard{flex:0 0 82%;scroll-snap-align:start;background:var(--surface);border-radius:14px;padding:12px;display:grid;grid-template-columns:74px 1fr;gap:14px;align-items:stretch;border:1px solid var(--line)}
.ccard .mini{width:74px;height:108px;border-radius:3px;background:var(--c);box-shadow:2px 2px 8px rgba(0,0,0,.25);align-self:center}
.ccard>div:last-child{display:flex;flex-direction:column;justify-content:center;min-width:0}
.ccard .t{font-family:var(--serif);font-weight:700;font-size:16px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;background:none;border:0;padding:0;text-align:left;width:100%}
.ccard .a{color:var(--muted);font-size:12px}
.bar{height:5px;background:var(--chip);border-radius:3px;overflow:hidden;margin:9px 0 6px}
.bar i{display:block;height:100%;background:var(--c,var(--accent))}
.crow{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap;gap:6px}
.crow .hbtns{margin-left:auto}

/* shelf */
.shelf{margin:0 12px;padding:6px 10px 0;display:flex;flex-wrap:wrap;align-content:flex-start;
  background:repeating-linear-gradient(to bottom,transparent 0 184px,var(--plank) 184px 192px,var(--plank-edge) 192px 196px);
  background-color:var(--surface-2);border-radius:6px;min-height:196px}
.slot{height:196px;padding-bottom:12px;display:flex;align-items:flex-end;margin-right:3px;position:relative}
.spine{width:var(--w);height:var(--h);background:var(--c);color:#F6F3EC;border:0;border-radius:3px 3px 1px 1px;padding:12px 0;
  writing-mode:vertical-rl;font-family:var(--serif);font-weight:700;font-size:13px;line-height:1;letter-spacing:.02em;
  display:flex;align-items:center;justify-content:flex-start;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;position:relative;
  box-shadow:inset 3px 0 0 rgba(255,255,255,.14),inset -4px 0 0 rgba(0,0,0,.2);transition:transform .15s ease}
.spine::before,.spine::after{content:"";position:absolute;left:0;right:0;height:2px;background:rgba(255,255,255,.28)}
.spine::before{top:6px}.spine::after{bottom:6px}
.spine span{overflow:hidden;text-overflow:ellipsis;max-height:100%}
.spine:hover{transform:translateY(-4px)}
.slot.want .spine{opacity:.42;outline:1px dashed var(--muted);outline-offset:-1px}
.slot.reading::before{content:"";position:absolute;top:calc(196px - 12px - var(--h) - 9px);left:calc(var(--w) * .55);width:7px;height:14px;background:var(--ribbon);
  clip-path:polygon(0 0,100% 0,100% 100%,50% 75%,0 100%);z-index:1}
.cat{margin:0 0 18px}
.cath{display:flex;align-items:baseline;gap:8px;padding:6px 22px 8px}
.cath h2{margin:0;font-family:var(--serif);font-size:20px;font-weight:700}
.cath span{font-size:12px;color:var(--muted)}
.wood{margin:0 12px;background:var(--shelf-bg,linear-gradient(180deg,var(--surface-2),var(--surface)));border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.wood{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.wood::-webkit-scrollbar{display:none}
.srow{flex:0 0 100%;scroll-snap-align:start;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:end;padding:18px 16px 0;border-bottom:9px solid var(--plank);box-shadow:inset 0 -2px 0 var(--plank-edge);position:relative}
.srow::after{content:"";position:absolute;left:0;right:0;bottom:-9px;height:3px;background:var(--plank-edge);opacity:.6}
.tile{background:none;border:0;padding:0;display:block;width:100%;transition:transform .15s}
.tile:hover{transform:translateY(-3px)}
.tile .cv{position:relative;aspect-ratio:2/3;width:100%;display:flex;align-items:flex-end}
.tile .cv img,.tile .gen{width:100%;height:100%;object-fit:cover;border-radius:2px 4px 4px 2px;box-shadow:-1px 0 0 rgba(0,0,0,.15),3px -2px 8px rgba(0,0,0,.28);display:block}
.tile .gen{background:var(--c);color:#F6F3EC;padding:12px 10px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;box-shadow:inset 5px 0 0 rgba(0,0,0,.18),3px -2px 8px rgba(0,0,0,.28)}
.tile .gen span{font-family:var(--serif);font-weight:700;font-size:14px;line-height:1.3;word-break:keep-all;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.tile .gen small{font-size:10px;opacity:.8;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tile .rib{position:absolute;top:-4px;right:10%;width:16px;height:30px;background:var(--ribbon);clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%);box-shadow:0 2px 3px rgba(0,0,0,.3)}

.pv .sti .bg,.hint .sti .bg{color:var(--line)}
.sti .fg{position:absolute;left:0;top:0;overflow:hidden;color:#F5D86B;white-space:nowrap}
.pv .sti .fg,.hint .sti .fg{color:var(--ribbon)}
.chip.star{letter-spacing:1px}
.chip.star[aria-pressed="true"]{color:#F5D86B}
.tile.wish .cv{opacity:.55}
.cath em{font-style:normal;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 8px;margin-left:auto}
.cat.pre .wood{background:repeating-linear-gradient(45deg,rgba(127,127,127,.12) 0 6px,transparent 6px 14px),var(--surface-2);border-style:dashed;border-color:var(--dot,var(--line))}
.cat.pre .srow{border-bottom-color:var(--line);box-shadow:inset 0 -2px 0 var(--muted)}
.cat.pre .srow::after{background:var(--muted);opacity:.35}
.dots{display:flex;justify-content:center;align-items:center;gap:10px;padding:9px 0 0}
.dwrap{max-width:204px;overflow:hidden;padding:4px 6px}
.dtrack{display:flex;gap:4px;transition:transform .25s ease;width:max-content}
.dot{width:8px;height:8px;border-radius:50%;border:0;padding:0;background:var(--dot,var(--muted));opacity:.55;transition:background .15s,transform .15s,opacity .15s;flex:none}
.dot.far{transform:scale(.55)}
.dot.on{background:var(--accent);opacity:1;transform:scale(1.3)}
.dn{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.dn b{color:var(--ink)}
.more{display:block;margin:10px auto 0;background:none;border:1px solid var(--line);border-radius:999px;padding:7px 16px;font-size:13px;color:var(--ink)}
.empty{padding:40px 24px;text-align:center;color:var(--muted)}
.empty p{margin:0 0 14px;font-family:var(--serif);font-size:18px;color:var(--ink)}
.legend{display:flex;gap:14px;padding:12px 22px 0;font-size:12px;color:var(--muted)}
.legend b{display:inline-block;width:8px;height:12px;border-radius:1px;margin-right:5px;vertical-align:-1px}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{background:none;border:0;padding:10px 0 12px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button[aria-current="page"]{color:var(--ink);font-weight:600}
.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}

/* sections */
.sec{background:var(--surface);margin:0 12px 12px;border-radius:14px;padding:16px;border:1px solid var(--line)}
.sec h2{font-size:14px;font-weight:600;margin:0 0 10px;color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}

/* goal */
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:18px;line-height:1}

.gshelf{display:flex;flex-wrap:wrap;gap:3px;align-items:flex-end;padding:10px 0 6px;border-bottom:4px solid var(--plank);margin-top:6px}
.gshelf i{width:12px;height:40px;border-radius:2px 2px 0 0;background:var(--c)}
.gshelf i.e{background:transparent;outline:1px dashed var(--line);outline-offset:-1px}
.gnote{margin-top:10px;font-family:var(--serif);font-size:17px}
.months{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;align-items:end;height:120px;border-bottom:1px solid var(--line)}
.months .m{display:flex;flex-direction:column-reverse;gap:2px;align-items:center;height:100%}
.months .m i{width:70%;height:14px;border-radius:2px;background:var(--c)}
.mlabels{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;font-size:11px;color:var(--muted);text-align:center;margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--surface-2);border-radius:10px;padding:10px}
.stats b{display:block;font-family:var(--serif);font-size:20px}
.stats span{font-size:12px;color:var(--muted)}

/* quotes */
.search{margin:0 20px 12px;display:block;width:calc(100% - 40px);border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}
.qcard{background:var(--surface);margin:0 12px 10px;border-radius:14px;padding:18px 18px 14px;border:1px solid var(--line);border-left:4px solid var(--c);text-align:left;width:calc(100% - 24px);display:block}
.qcard blockquote{margin:0;font-family:var(--serif);font-size:17px;line-height:1.75;white-space:pre-wrap}
.qcard .meta{margin-top:10px;font-size:12px;color:var(--muted)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:10;background:var(--bg);overflow-y:auto;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.open{transform:none}
.sheet .in{max-width:480px;margin:0 auto;padding-bottom:40px}
.sbar{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--bg)}
.cover{margin:6px 20px 18px;background:var(--c);color:#F6F3EC;border-radius:4px 10px 10px 4px;padding:26px 22px 22px 30px;position:relative;min-height:170px;display:flex;flex-direction:column;justify-content:flex-end;
  box-shadow:inset 8px 0 0 rgba(0,0,0,.18),inset 10px 0 0 rgba(255,255,255,.1)}
.cover.has-img{flex-direction:row;align-items:flex-end;gap:16px;padding-left:24px}
.cover .cimg{width:92px;height:auto;max-height:136px;object-fit:cover;border-radius:2px;box-shadow:0 4px 12px rgba(0,0,0,.35);flex:none}
.cover .ctext{min-width:0}
.ccard img.mini{object-fit:cover}
.qphoto{display:block;max-width:100%;border-radius:8px;margin:2px 0 8px}
.cover2{margin:6px 16px 16px;display:grid;grid-template-columns:118px 1fr;gap:16px;align-items:start}
.cover2 .cvbox{width:118px;aspect-ratio:2/3;border-radius:3px 7px 7px 3px;overflow:hidden;box-shadow:-1px 0 0 rgba(0,0,0,.15),4px 6px 16px rgba(0,0,0,.3)}
.cover2 .cvbox img{width:100%;height:100%;object-fit:cover;display:block}
.cover2 .gen{width:100%;height:100%;background:var(--c);color:#F6F3EC;padding:14px 12px;box-shadow:inset 7px 0 0 rgba(0,0,0,.18),inset 9px 0 0 rgba(255,255,255,.1);display:flex;align-items:flex-end}
.cover2 .gen span{font-family:var(--serif);font-weight:700;font-size:15px;line-height:1.3;word-break:keep-all;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.cover2 .ctext{min-width:0;padding-top:4px}
.cover2 .ct{font-family:var(--serif);font-weight:700;font-size:19px;line-height:1.35;word-break:keep-all}
.cover2 .cs{font-family:var(--serif);font-size:13px;line-height:1.45;color:var(--muted);margin-top:4px;word-break:keep-all}
.cover2 .ca{font-size:13px;color:var(--ink);margin-top:10px;line-height:1.5}
.cover2 .ca2{font-size:12px;color:var(--muted);margin-top:4px}
.cover .ct{font-family:var(--serif);font-weight:700;font-size:26px;line-height:1.3;word-break:keep-all}
.cover .ca{margin-top:6px;font-size:14px;opacity:.85}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--chip);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:8px;padding:8px 0;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--surface);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.stars{position:relative;display:inline-block;font-size:28px;line-height:1;letter-spacing:2px;cursor:pointer;user-select:none;touch-action:manipulation}
.stars .bg{color:var(--line)}
.stars .fg{position:absolute;inset:0;overflow:hidden;color:var(--ribbon);white-space:nowrap;width:var(--p)}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}
.prog .nums{display:flex;align-items:baseline;gap:6px;font-size:14px;color:var(--muted)}
.prog input[type=number]{width:72px;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px 8px;font-family:var(--serif);font-size:18px;color:var(--ink)}
.prog input[type=range]{width:100%;accent-color:var(--accent);margin:12px 0 2px}
.dates{font-size:12px;color:var(--muted);margin-top:6px}
.dtabs{display:flex;gap:4px;padding:0 20px;margin:4px 0 10px;border-bottom:1px solid var(--line)}
.dtabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 10px;font-size:14px;color:var(--muted);margin-bottom:-1px}
.dtabs button[aria-selected="true"]{color:var(--ink);border-color:var(--ink);font-weight:600}
.panel{padding:0 12px}
textarea.note{display:block;width:100%;min-height:180px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;font-family:var(--serif);font-size:16px;line-height:1.8;resize:vertical}
.hint{font-size:12px;color:var(--muted);margin:8px 4px 0}
.qadd{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:14px}
.qadd textarea{width:100%;min-height:90px;border:0;background:transparent;font-family:var(--serif);font-size:16px;line-height:1.7;resize:vertical;padding:2px}

.qadd input{width:76px;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px 8px}
.qitem{border-left:3px solid var(--c);padding:6px 0 6px 14px;margin:0 4px 16px}
.qitem blockquote{margin:0;font-family:var(--serif);font-size:16px;line-height:1.75;white-space:pre-wrap}
.qitem .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px}
.qitem .meta button{background:none;border:0;color:var(--muted);font-size:12px;padding:0}

/* modal form */
.modal{position:fixed;inset:0;z-index:20;background:rgba(10,14,20,.45);display:flex;align-items:flex-end;justify-content:center}
.modal[hidden]{display:none}
.mbox{background:var(--surface);width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:18px 20px calc(20px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow-y:auto}
.mbox h3{font-family:var(--serif);font-size:20px;margin:4px 0 14px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.field input[type=text],.field input[type=number]{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 12px}
.srcrow{display:flex;gap:10px;align-items:center;font-size:12px;margin-top:4px}
.srcrow em{font-style:normal;color:var(--muted);background:var(--chip);border-radius:999px;padding:1px 7px}
.srcrow a{color:var(--accent);font-weight:600;text-decoration:none}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:30px;height:30px;border-radius:50%;border:0;background:var(--c)}
.swatches button[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:2px}
.mact{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.err{color:var(--danger);font-size:13px;margin-top:4px}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;z-index:30;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13px;transition:all .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sync{font-size:11px;color:var(--muted);text-align:center;padding:18px 0 0}
.hbtns{display:flex;gap:6px;flex-wrap:nowrap;flex:none}
.top h1{white-space:nowrap}
.imp{position:fixed;inset:0;z-index:15;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.imp[hidden]{display:none}
.imp .in{max-width:480px;margin:0 auto;padding-bottom:40px}
.imp p{margin:0 0 10px}
.note-box{background:var(--surface-2);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--muted);line-height:1.6}
.maprow{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.maprow:last-child{border-bottom:0}
.maprow label{font-size:13px}
.maprow select{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:7px 8px;font-size:13px}
.maprow select.set{border-color:var(--accent)}
.pv{display:grid;grid-template-columns:8px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.pv:last-child{border-bottom:0}
.pv i{border-radius:2px;background:var(--c)}
.pv b{font-family:var(--serif);font-size:15px;display:block}
.pv span{color:var(--muted)}
.sumline{font-family:var(--serif);font-size:17px;line-height:1.6}
.radio{display:flex;flex-direction:column;gap:8px;font-size:14px}
.radio label{display:flex;gap:8px;align-items:flex-start}
.radio input{margin-top:4px;accent-color:var(--accent)}
.bigbar{height:8px;background:var(--chip);border-radius:4px;overflow:hidden;margin:14px 0 8px}
.bigbar i{display:block;height:100%;background:var(--accent);transition:width .2s}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>

const EN_KEYS=Object.keys(EN_STR).sort((a,b)=>b.length-a.length);
function trText(t){if(lang()!=='en')return t;for(const [rx,rep] of EN_RX)t=t.replace(rx,rep);for(const k of EN_KEYS)if(t.includes(k))t=t.split(k).join(EN_STR[k]);return t}
function tr(html){const parts=String(html).split(/([\uE000\uE001])/);let inside=0,out='';
  for(const p of parts){if(p==='\uE000'){inside++;continue}if(p==='\uE001'){inside--;continue}out+=inside>0?p:trText(p)}return out}

function applySkin(){if(S.settings.skin==='oak'){S.settings.skin='wood';if(S.settings.toneB==null)S.settings.toneB=75}
  if(S.settings.toneB==null&&S.settings.tone)S.settings.toneB=50+S.settings.tone*25;if(S.settings.toneW==null&&S.settings.warm)S.settings.toneW=50+S.settings.warm*25;
  const r=document.documentElement;r.dataset.skin=S.settings.skin||'wood';const b=+(S.settings.toneB??50),w=+(S.settings.toneW??50);
  r.style.setProperty('--tl',(b>50?(b-50)/50*16:0)+'%');r.style.setProperty('--td',(b<50?(50-b)/50*16:0)+'%');
  r.style.setProperty('--tw',(w>50?(w-50)/50*12:0)+'%');r.style.setProperty('--tc',(w<50?(50-w)/50*12:0)+'%')}

function loadLocal(){try{const d=JSON.parse(localStorage.getItem(LS)||'null');if(d){S.books=d.books||{};S.settings={...S.settings,...(d.settings||{})};S.synced=!!d.synced}}catch(e){}}
function saveLocal(){const lite=()=>{const o={};for(const k in S.books){const b={...S.books[k]};delete b.cover;b.quotes=(b.quotes||[]).filter(q=>!q.photo);o[k]=b}return o};
  const put=books=>localStorage.setItem(LS,JSON.stringify({books,settings:S.settings,synced:S.synced}));
  try{put(cloud?lite():S.books)}catch(e){try{put(lite())}catch(e2){}}}
function onWriteErr(e){if(e&&e.code==='invalid_argument'){cloud=null;setSync('이 기기에만 저장 중');}else if(e&&e.code==='quota_exceeded'){toast('저장 공간이 가득 찼어요. 책이나 문구를 일부 삭제해 주세요')}}
function putBook(b){b.updatedAt=Date.now();S.books[b.id]=b;saveLocal();if(cloud)cloud.books.doc(b.id).set(JSON.parse(JSON.stringify(b))).catch(onWriteErr)}
const timers={};
function putBookLater(b){S.books[b.id]=b;saveLocal();clearTimeout(timers[b.id]);timers[b.id]=setTimeout(()=>putBook(S.books[b.id]),700)}
function removeBook(id){delete S.books[id];saveLocal();if(cloud)cloud.books.doc(id).delete().catch(onWriteErr)}
function putSettings(){saveLocal();if(cloud)cloud.settings.set({...S.settings}).catch(onWriteErr)}
function setSync(t){S.syncMsg=t;$('#sync').textContent=trText(t)}

async function initCloud(){
  if(!window.claude||!window.claude.use){setSync('이 기기에만 저장 중');return}
  claude.use('downloads').then(d=>{dl=d;renderSoon()});
  claude.use('sample').then(async s=>{sample=s;if(s){try{const l=await s.limits();sampleImages=!!(l&&l.images)}catch(e){}}renderAll()});
  const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
  const id=user?await user.id():null;
  if(!db||!id){setSync('이 기기에만 저장 중');return}
  const base=db.doc('data/users/'+id+'/profile');
  cloud={books:base.collection('books'),settings:db.doc('data/users/'+id+'/settings')};
  setSync('내 계정에 저장 중');
  let first=true;
  cloud.books.onSnapshot(snap=>{
    if(first){first=false;
      if(snap.empty&&!S.synced&&list().length){list().forEach(b=>cloud.books.doc(b.id).set(JSON.parse(JSON.stringify(b))).catch(onWriteErr));S.synced=true;saveLocal();return}
    }
    S.synced=true;
    if(S.importing)return;
    const nb={};snap.docs.forEach(d=>{nb[d.id]={...d.data()}});
    for(const k in timers){if(S.books[k]&&nb[k])nb[k]=S.books[k]}
    S.books=nb;saveLocal();migrateCats();renderSoon();
  },()=>{cloud=null;setSync('이 기기에만 저장 중')});
  cloud.settings.onSnapshot(s=>{if(s.exists){S.settings={...S.settings,...s.data()};applySkin();saveLocal();renderSoon()}},()=>{});
}
let rsT;function renderSoon(){clearTimeout(rsT);rsT=setTimeout(renderSoonNow,120)}
function renderSoonNow(){const a=document.activeElement;if(a&&/INPUT|TEXTAREA/.test(a.tagName)&&a.type!=='file'){pendingRender=true;return}renderAll()}
document.addEventListener('focusout',()=>setTimeout(()=>{if(pendingRender){pendingRender=false;renderSoon()}},50));

/* ---------- views ---------- */
const doneThisYear=()=>list().filter(b=>b.status==='done'&&(b.finishedAt||'').startsWith(String(YEAR)));

function coverHTML(b){return b.cover?`<img src="${b.cover}" alt="" decoding="sync">`:`<div class="gen" style="--c:${b.color}"><span>${esc(b.title)}</span><small>${esc(b.author||'')}</small></div>`}
function tileHTML(b,mixed){const p=pct(b);
  return `<button class="tile${mixed&&b.status==='want'?' wish':''}${S.selMode&&S.sel.has(b.id)?' sel':''}" data-action="${S.selMode?'seltile':'open'}" data-id="${b.id}" aria-label="${esc(b.title)}, ${STATUS[b.status]}${b.rating?', 평점 '+b.rating:''}">
    <div class="cv">${coverHTML(b)}${b.format?`<span class="fm">${FORMAT[b.format]}</span>`:''}${b.status==='reading'?'<i class="rib"></i>':''}${b.status==='reading'&&b.pages?`<i class="pg"><b style="width:${p}%"></b></i>`:''}${b.rating?`<span class="rt">${starsInline(b.rating)}</span>`:''}</div></button>`}
function sectionHTML(key,name,books,mixed,pre){const pages=[];for(let i=0;i<books.length;i+=3)pages.push(books.slice(i,i+3));
  const dots=pages.length<=1?'':`<div class="dots"><div class="dwrap"><div class="dtrack">${pages.map((_,i)=>`<button class="dot${i===0?' on':''}${i>14?' far':''}" data-action="dot" data-i="${i}" aria-label="${i+1}/${pages.length}"></button>`).join('')}</div></div>${pages.length>16?`<span class="dn"><b>1</b>/${pages.length}</span>`:''}</div>`;
  return `<section class="cat${pre?' pre':''}"><div class="cath"><h2>${esc(name)}</h2><span>${books.length}권</span>${pre?'<em>서재 입고 전</em>':''}</div>
    <div class="wood" data-pages="${pages.length}">${pages.map(r=>`<div class="srow">${r.map(b=>tileHTML(b,mixed)).join('')}</div>`).join('')}</div>${dots}</section>`}
const sortIn=(a,b)=>((b.rating||0)-(a.rating||0))||({reading:0,done:1,want:2}[a.status]-{reading:0,done:1,want:2}[b.status])||(b.finishedAt||'').localeCompare(a.finishedAt||'')||(b.createdAt||0)-(a.createdAt||0);
function groupByCat(books){const m=new Map();books.forEach(b=>{const c=(b.category||'').trim()||'미분류';if(!m.has(c))m.set(c,[]);m.get(c).push(b)});
  return [...m.entries()].sort((a,b)=>a[0]==='미분류'?1:b[0]==='미분류'?-1:a[0].localeCompare(b[0],'ko')).map(([c,bs])=>[c,bs.sort(sortIn)])}
function vShelf(){
  const all=list(),f=S.filter,sq=S.sq.trim().toLowerCase();
  const RF={'5':r=>r>=5,'4':r=>r>=4,'3':r=>r>=3,'low':r=>r>0&&r<=2,'none':r=>!r};const rfok=b=>!S.rf||RF[S.rf](b.rating||0);
  const rchips=[['','모든 평점'],['5','★★★★★'],['4','★★★★ 이상'],['3','★★★ 이상'],['low','★★ 이하'],['none','평점 없음']]
    .map(([k,l])=>`<button class="chip${k&&k!=='none'?' star':''}" data-action="rfilter" data-f="${k}" aria-pressed="${S.rf===k}">${l}</button>`).join('');

  const reading=all.filter(b=>b.status==='reading');
  const chips=[['all','전체'],['reading','읽는 중'],['want','Wishlist'],['done','다 읽음'],['owned','소장']]
    .map(([k,l])=>`<button class="chip" data-action="filter" data-f="${k}" aria-pressed="${f===k}">${l} ${k==='all'?all.length:all.filter(b=>k==='owned'?b.owned:b.status===k).length}</button>`).join('');
  const cont=reading.length&&f==='all'&&!sq&&!S.rf?`<div class="cath"><h2>읽는 중</h2><span>${reading.length}권</span><em>지금 읽는 책</em></div><div class="cont">${reading.map(b=>`
    <div class="ccard" style="--c:${b.color}">${b.cover?`<img class="mini" src="${b.cover}" alt="" decoding="sync">`:'<div class="mini"></div>'}<div>
      <button class="t" data-action="open" data-id="${b.id}">${esc(b.title)}</button><div class="a">${esc(b.author||'')}</div>
      <div class="bar"><i style="width:${pct(b)}%"></i></div>
      <div class="crow"><span>${b.current||0} / ${b.pages||'?'}쪽, ${pct(b)}%${(d=>d?` · 예상 완독 ${d.slice(5).replace('-','/')}`:'')(estimate(b))}</span>${S.timer&&S.timer.bookId===b.id?`<button class="btn small" data-action="open" data-id="${b.id}">⏱ <span data-elapsed>${elapsedText()}</span></button>`:`<span class="hbtns"><button class="btn ghost small" data-action="plus" data-id="${b.id}">+10쪽</button>${S.timer?'':`<button class="btn small" data-action="startopen" data-id="${b.id}">읽기 시작</button>`}</span>`}</div>
    </div></div>`).join('')}</div>`:'';
  const topCards=f==='all'&&!sq&&!S.rf&&!S.selMode&&all.length?todayCardHTML()+quoteCardHTML():'';
  let body='';
  if(!bs.length)body=`<div class="empty"><p>${all.length?'이 칸은 아직 비어 있어요':'첫 책을 꽂아보세요'}</p>${all.length?'':'<div class="hbtns" style="justify-content:center"><button class="btn" data-action="import">Bookswing 백업 가져오기</button><button class="btn ghost" data-action="add">직접 추가</button></div>'}</div>`;
  else if(f==='all'&&!sq&&!S.rf){const wish=bs.filter(b=>b.status==='want').sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    const rest=bs.filter(b=>b.status!=='want'&&b.status!=='reading'),summ=rest.filter(b=>b.category==='BookSummary').sort(sortIn);
    body=(wish.length?sectionHTML('__wish','Wishlist',wish,false,true):'')+(summ.length?sectionHTML('BookSummary','BookSummary',summ,false,true):'')
      +groupByCat(rest.filter(b=>b.category!=='BookSummary')).map(([c,x])=>sectionHTML(c,c,x,false)).join('')}
  else body=groupByCat(bs).map(([c,x])=>sectionHTML(c,c,x,f!=='want',c==='BookSummary'||f==='want')).join('');
  return `<header class="top"><div><h1>내 서재</h1><div class="sub">올해 ${doneThisYear().length}권 읽음, 목표 ${S.settings.goal}권</div></div><div class="hbtns"><button class="btn ghost" data-action="selmode">${S.selMode?'선택 끝':'선택'}</button><button class="btn ghost" data-action="import">가져오기</button><button class="btn" data-action="add">책 추가</button></div></header>${bulkBarHTML()}
    ${all.length>12?`<input class="search" type="search" placeholder="제목, 저자, 분류로 찾기" value="${esc(S.sq)}" data-field="sq" aria-label="책 검색">`:''}
    <div class="chips" role="group" aria-label="상태 필터">${chips}</div><div class="chips" role="group" aria-label="평점 필터" style="padding-top:0">${rchips}</div>${topCards}${cont}${body}
    ${bs.length?'<div class="legend"><span><b style="background:var(--ribbon)"></b>리본: 읽는 중</span><span>★ 내 평점(0.5점 단위)</span></div>':''}`;
}

/* ---------- habits: daily goal, streak, heatmap, estimate ---------- */
const dailyCfg=()=>({unit:S.settings.dailyUnit||'min',target:+S.settings.dailyTarget||20,days:+S.settings.weeklyDays||5});
function dayMap(){const m={};list().forEach(b=>(b.sessions||[]).forEach(x=>{const d=x.date;if(!d)return;const o=m[d]||(m[d]={min:0,pages:0});o.min+=+x.minutes||0;o.pages+=Math.max(0,(+x.to||0)-(+x.from||0))}));return m}
const dayVal=(o,unit)=>o?(unit==='min'?o.min:o.pages):0;
const isRead=o=>!!o&&(o.min>0||o.pages>0);
function dstr(d){return ymd(d)}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function streak(m){let n=0;let d=new Date();if(!isRead(m[dstr(d)]))d=addDays(d,-1);while(isRead(m[dstr(d)])){n++;d=addDays(d,-1)}return n}
function bestStreak(m){const ds=Object.keys(m).filter(k=>isRead(m[k])).sort();let best=0,cur=0,prev=null;for(const k of ds){const d=new Date(k);cur=(prev&&(d-prev)/864e5===1)?cur+1:1;best=Math.max(best,cur);prev=d}return best}
function weekDays(m){const d=new Date();const dow=(d.getDay()+6)%7;let n=0;for(let i=0;i<=dow;i++)if(isRead(m[dstr(addDays(d,-i))]))n++;return n}
function estimate(b){if(!b.pages||b.status!=='reading')return'';const rem=b.pages-(b.current||0);if(rem<=0)return'';
  const m=dayMap();let pg=0;for(let i=0;i<7;i++){const o=m[dstr(addDays(new Date(),-i))];if(o)pg+=o.pages}
  if(pg<=0)return'';const days=Math.ceil(rem/(pg/7));return dstr(addDays(new Date(),days))}
function todayCardHTML(){const c=dailyCfg(),m=dayMap(),t=m[dstr(new Date())],v=dayVal(t,c.unit),p=Math.min(1,v/c.target),st=streak(m),wk=weekDays(m);
  const r=20,circ=2*Math.PI*r;
  return `<section class="today" data-action="tab" data-tab="goal" role="button" tabindex="0"><svg viewBox="0 0 48 48" class="ring" aria-hidden="true"><circle cx="24" cy="24" r="${r}"/><circle cx="24" cy="24" r="${r}" style="stroke-dasharray:${circ};stroke-dashoffset:${circ*(1-p)}"/></svg>
    <div class="tt"><b>${v}${c.unit==='min'?'분':'쪽'} / ${c.target}${c.unit==='min'?'분':'쪽'}</b><span>오늘</span></div>
    <div class="tt"><b>${st}일</b><span>연속</span></div><div class="tt"><b>${wk}/${c.days}일</b><span>이번 주</span></div></section>`}
function heatmapHTML(){const c=dailyCfg(),m=dayMap();const end=new Date();const dow=(end.getDay()+6)%7;const start=addDays(end,-(dow+77));const cells=[];
  for(let i=0;i<84;i++){const d=addDays(start,i);const k=dstr(d);const o=m[k];const v=dayVal(o,c.unit);const lv=d>end?-1:!v?0:v>=c.target?3:v>=c.target/2?2:1;cells.push(`<i class="l${lv}" title="${k} ${v}${c.unit==='min'?'분':'쪽'}"></i>`)}
  return `<div class="heat">${cells.join('')}</div><div class="hint" style="margin-top:6px">최근 12주, 진할수록 목표에 가까움. 최고 연속 ${bestStreak(m)}일</div>`}
function dailyGoalHTML(){const c=dailyCfg();
  return `<div class="sec"><h2>매일 목표</h2><div class="row"><div class="seg" style="width:140px"><button data-action="dunit" data-v="min" aria-pressed="${c.unit==='min'}">분</button><button data-action="dunit" data-v="pages" aria-pressed="${c.unit==='pages'}">쪽</button></div>
    <div class="stepper"><button data-action="dtarget" data-d="-5" aria-label="목표 줄이기">−</button><output>${c.target}${c.unit==='min'?'분':'쪽'}</output><button data-action="dtarget" data-d="5" aria-label="목표 늘리기">+</button></div></div>
    <div class="row" style="margin-top:10px"><span style="font-size:14px">일주일에 읽는 날</span><div class="stepper"><button data-action="wdays" data-d="-1" aria-label="줄이기">−</button><output>${c.days}일</output><button data-action="wdays" data-d="1" aria-label="늘리기">+</button></div></div>
    <div style="margin-top:14px">${heatmapHTML()}</div></div>`}
function autoSession(b,from,to){if(S.timer&&S.timer.bookId===b.id)return;if(to===from)return;b.sessions=[...(b.sessions||[]),{date:today(),start:Date.now(),end:Date.now(),minutes:0,from,to,auto:true}]}

/* ---------- quote of the day ---------- */
function quoteCardHTML(){const items=[];list().forEach(b=>(b.quotes||[]).forEach(x=>{if(x.text)items.push({b,x})}));if(items.length<12)return'';
  const seed=hash(today())+(S.qshift||0);const {b,x}=items[seed%items.length];
  return `<section class="qotd" style="--c:${b.color}"><div class="qh"><span>오늘의 문구</span><button class="linkbtn" data-action="qnext" style="font-size:12px">다음 문구 ›</button></div>
    <button class="qbody" data-action="openq" data-id="${b.id}"><blockquote>${esc(x.text)}</blockquote><div class="meta">《${esc(b.title)}》${x.page?` p.${esc(x.page)}`:''}</div></button></section>`}

/* ---------- journal timeline ---------- */
function timelineHTML(b){const ev=[];
  (b.sessions||[]).forEach(x=>ev.push({d:x.date,ts:x.end||0,k:'session',x}));
  (b.events||[]).forEach(x=>ev.push({d:x.date,ts:x.ts||0,k:x.type,x}));
  if(b.startedAt)ev.push({d:b.startedAt,ts:0,k:'started'});if(b.finishedAt)ev.push({d:b.finishedAt,ts:1,k:'finished'});
  (b.readHistory||[]).forEach(h=>{if(h.startedAt)ev.push({d:h.startedAt,ts:0,k:'started'});if(h.finishedAt)ev.push({d:h.finishedAt,ts:1,k:'finished'})});
  if(!ev.length)return'<p class="hint" style="text-align:center;padding:16px 0">아직 기록이 없어요. 타이머로 읽거나 진도를 올리면 여기에 쌓여요.</p>';
  ev.sort((a,c)=>(c.d||'').localeCompare(a.d||'')||(c.ts-a.ts));
  const line=e=>{switch(e.k){case 'session':return `<b>${e.x.minutes?fmtMin(e.x.minutes):'진도'}</b> ${e.x.from!=null?`${e.x.from} → ${e.x.to}쪽`:''}${e.x.note?`<p>${esc(e.x.note)}</p>`:''}`;
    case 'started':return '<b>시작</b>';case 'finished':return '<b>완독</b>';case 'progress':return `<b>진도</b> ${e.x.page}쪽`;case 'rated':return `<b>평점</b> ${starsInline(e.x.rating||0)}`;case 'note':return `<b>메모</b><p>${esc(e.x.text||'')}</p>`;default:return esc(e.x.text||'')}};
  return `<div class="tl">${ev.map(e=>`<div class="tli ${e.k}"><span>${e.d||''}</span><div>${line(e)}</div></div>`).join('')}</div>`}

/* ---------- timer / sessions ---------- */
const TK='mybookshelf.timer';
function loadTimer(){try{S.timer=JSON.parse(localStorage.getItem(TK)||'null')}catch(e){S.timer=null}}
function saveTimer(){try{S.timer?localStorage.setItem(TK,JSON.stringify(S.timer)):localStorage.removeItem(TK)}catch(e){}}
function startTimer(id){const b=S.books[id];if(!b)return;if(b.status==='want'){setStatus(b,'reading');putBook(b)}else if(b.status==='done'){reread(b)}
  S.timer={bookId:id,startedAt:Date.now(),from:b.current||0};saveTimer();S.finishing=false}
function elapsedText(){if(!S.timer)return'';const s=Math.floor((Date.now()-S.timer.startedAt)/1000);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':':'')+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0')}
setInterval(()=>{if(!S.timer)return;const t=elapsedText();document.querySelectorAll('[data-elapsed]').forEach(e=>e.textContent=t)},1000);
function finishSession(toPage,note){const t=S.timer;if(!t)return;const b=S.books[t.bookId];const mins=Math.max(1,Math.round((Date.now()-t.startedAt)/60000));
  if(b){const to=Math.max(0,parseInt(toPage)||b.current||0);const sess={date:today(),start:t.startedAt,end:Date.now(),minutes:mins,from:t.from,to:to,note:(note||'').trim()};
    b.sessions=[...(b.sessions||[]),sess];b.current=b.pages?Math.min(b.pages,to):to;if(b.pages&&b.current>=b.pages&&b.status!=='done')setStatus(b,'done');putBook(b)}
  S.timer=null;S.finishing=false;saveTimer();toast(`${fmtMin(mins)} 읽었어요`)}
function timerHTML(b){const t=S.timer;
  if(t&&t.bookId===b.id){return `<div class="timer on"><div><span class="hint" style="margin:0">읽는 중</span><b data-elapsed>${elapsedText()}</b></div>
    ${S.finishing?`<div class="fin"><label>어디까지 읽었나요?</label><input type="number" id="toPage" min="0" max="${b.pages||99999}" value="${b.current||0}" inputmode="numeric"> ${b.pages?`/ ${b.pages}쪽`:'쪽'}
      <input type="text" id="sesNote" placeholder="한 줄 메모 (선택)" style="display:block;width:100%;margin-top:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px">
      <div class="hbtns" style="margin-top:8px"><button class="btn small" data-action="sessave">세션 저장</button><button class="btn ghost small" data-action="sescancel">타이머 취소</button><button class="btn ghost small" data-action="finback">계속 읽기</button></div></div>`
    :`<button class="btn small" data-action="finish">읽기 끝내기</button>`}</div>`}
  if(t)return `<p class="hint">다른 책 타이머가 진행 중이에요</p>`;
  return `<button class="btn ghost small" data-action="start" data-id="${b.id}">읽기 시작 (타이머)</button>`}
function sessionsHTML(b){const ss=(b.sessions||[]).slice().reverse();if(!ss.length)return'';const tot=ss.reduce((s,x)=>s+(+x.minutes||0),0);
  return `<details class="sess"><summary>독서 세션 ${ss.length}회, 총 ${fmtMin(tot)}</summary>${ss.slice(0,20).map(x=>`<div class="srec"><span>${x.date}</span><span>${fmtMin(x.minutes)}</span><span>${x.from} → ${x.to}쪽</span></div>`).join('')}</details>`}

/* ---------- reread ---------- */
function reread(b){b.readHistory=[...(b.readHistory||[]),{startedAt:b.startedAt||'',finishedAt:b.finishedAt||''}];b.readCount=Math.max(1,+b.readCount||1)+1;
  b.status='reading';b.startedAt=today();b.finishedAt='';b.current=0;putBook(b);toast(`${b.readCount}번째 읽기를 시작했어요`)}

/* ---------- bulk edit ---------- */
function bulkApply(fn){const ids=[...S.sel];ids.forEach(id=>{const b=S.books[id];if(b){fn(b);putBook(b)}});toast(`${ids.length}권을 바꿨어요`)}
function bulkBarHTML(){if(!S.selMode)return'';const n=S.sel.size;
  return `<div class="bulk"><div class="row"><b>${n}권 선택</b><button class="linkbtn" data-action="selall">${n?'선택 해제':'전체 선택'}</button><button class="linkbtn" data-action="seldone">완료</button></div>
    <div class="hbtns" style="flex-wrap:wrap;margin-top:6px"><button class="chip" data-action="bown" data-v="1" ${n?'':'disabled'}>소장 표시</button><button class="chip" data-action="bown" data-v="0" ${n?'':'disabled'}>소장 해제</button>
      ${Object.entries(FORMAT).map(([k,l])=>`<button class="chip" data-action="bfmt" data-v="${k}" ${n?'':'disabled'}>${l}</button>`).join('')}</div>
    <div class="hbtns" style="margin-top:6px"><input type="text" id="bcat" list="catlist2" placeholder="분류 바꾸기" style="flex:1;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:7px 10px"><button class="btn small" data-action="bcat" ${n?'':'disabled'}>적용</button>
      <datalist id="catlist2">${[...new Set(list().map(b=>b.category).filter(Boolean))].sort().map(c=>`<option value="${esc(c)}">`).join('')}</datalist></div></div>`}

/* ---------- category rename ---------- */
function renameCat(from,to){to=(to||'').trim();if(!to||to===from)return;let n=0;list().forEach(b=>{if((b.category||'')===from){b.category=to;putBook(b);n++}});S.renameCat=null;toast(`${n}권의 분류를 바꿨어요`)}

/* ---------- export ---------- */
let dl=null;
function csvCell(v){v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
async function exportData(kind){if(!dl)return;const d=today();
  try{if(kind==='json'){await dl.save({filename:`MyBookShelf_${d}.json`,data:JSON.stringify({app:'MyBookShelf',exportedAt:new Date().toISOString(),settings:S.settings,books:list()},null,1)})}
    else{const H=['title','author','publisher','isbn','category','format','pages','current','status','rating','owned','startedAt','finishedAt','readCount','review','summary','quotes','sessions'];
      const rows=list().map(b=>[b.title,b.author,b.publisher,b.isbn,b.category,FORMAT[b.format]||'',b.pages,b.current,STATUS[b.status],b.rating,b.owned?'Y':'',b.startedAt,b.finishedAt,b.readCount||'',b.review,b.summary,
        (b.quotes||[]).filter(q=>q.text).map(q=>q.text.replace(/\n/g,' ')+(q.page?` (p.${q.page})`:'')).join(' | '),(b.sessions||[]).length].map(csvCell).join(','));
      await dl.save({filename:`MyBookShelf_${d}.csv`,data:'\uFEFF'+H.join(',')+'\n'+rows.join('\n')})}
    toast('파일을 저장했어요')}
  catch(e){if(e&&e.code==='user_cancelled')return;if(e&&e.code==='unavailable'){dl=null;renderMain()}toast('파일을 저장하지 못했어요')}}

function doneInYear(y){return list().filter(b=>b.status==='done'&&(b.finishedAt||'').startsWith(String(y)))}
function sessionsIn(y){const out=[];list().forEach(b=>(b.sessions||[]).forEach(x=>{if((x.date||'').startsWith(String(y)))out.push({...x,book:b})}));return out}
function fmtMin(m){m=Math.round(m);return m>=60?`${Math.floor(m/60)}시간 ${m%60}분`:`${m}분`}
function vGoal(){
  const years=[...new Set([YEAR,...list().map(b=>+(b.finishedAt||'').slice(0,4)).filter(Boolean)])].sort((a,b)=>b-a);
  const y=S.year||YEAR,isCur=y===YEAR,g=S.settings.goal;
  const done=doneInYear(y).sort((a,b)=>(a.finishedAt||'').localeCompare(b.finishedAt||''));
  const slots=Math.max(g,done.length);
  const gs=Array.from({length:slots},(_,i)=>done[i]?`<i style="--c:${done[i].color}" title="${esc(done[i].title)}"></i>`:'<i class="e"></i>').join('');
  const left=g-done.length;
  const months=Array.from({length:12},(_,m)=>done.filter(b=>+b.finishedAt.slice(5,7)===m+1));
  const mpages=months.map(ms=>ms.reduce((s,b)=>s+(+b.pages||0),0)),mp=Math.max(1,...mpages);
  const pages=done.reduce((s,b)=>s+(+b.pages||0),0);
  const rated=done.filter(b=>b.rating);
  const avg=rated.length?(rated.reduce((s,b)=>s+b.rating,0)/rated.length).toFixed(1):'-';
  const qn=list().reduce((s,b)=>s+(b.quotes||[]).length,0);
  const ses=sessionsIn(y),mins=ses.reduce((s,x)=>s+(+x.minutes||0),0);
  const longest=done.filter(b=>b.pages).sort((a,b)=>b.pages-a.pages)[0];
  const best=rated.slice().sort((a,b)=>b.rating-a.rating||(b.finishedAt||'').localeCompare(a.finishedAt||''))[0];
  const cats=Object.entries(done.reduce((m,b)=>{const c=b.category||'미분류';m[c]=(m[c]||0)+1;return m},{})).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const fmts=Object.entries(done.reduce((m,b)=>{if(b.format)m[b.format]=(m[b.format]||0)+1;return m},{}));
  return `<header class="top"><div><h1>독서 목표</h1><div class="sub">${y}년</div></div></header>
  <div class="chips" role="group" aria-label="연도">${years.map(v=>`<button class="chip" data-action="year" data-y="${v}" aria-pressed="${v===y}">${v}</button>`).join('')}</div>
  <div class="sec"><div class="row"><h2 style="margin:0">${isCur?'올해 읽을 책':'완독한 책'}</h2>
    ${isCur?`<div class="stepper"><button data-action="goal" data-d="-1" aria-label="목표 줄이기">−</button><output>${g}권</output><button data-action="goal" data-d="1" aria-label="목표 늘리기">+</button></div>`:`<span style="font-family:var(--serif);font-size:22px;font-weight:700">${done.length}권</span>`}</div>
    ${isCur?`<div class="gshelf" aria-label="목표 ${g}권 중 ${done.length}권 완독">${gs}</div>
    <div class="gnote">${left>0?`${done.length}권 읽었고, ${left}권 남았어요`:`목표를 채웠어요. 지금까지 ${done.length}권`}</div>`:''}</div>
  ${isCur?dailyGoalHTML():''}
  <div class="sec"><h2>연간 요약</h2><div class="stats">
    <div><b>${done.length}</b><span>완독</span></div><div><b>${pages.toLocaleString()}</b><span>읽은 쪽</span></div><div><b>${avg}</b><span>평균 평점</span></div>
    <div><b>${ses.length?fmtMin(mins):'-'}</b><span>독서 시간</span></div><div><b>${ses.length}</b><span>독서 세션</span></div><div><b>${qn}</b><span>남긴 문구</span></div></div>
    ${longest||best?`<div class="kv">${longest?`<div><span>가장 긴 책</span><b>${esc(longest.title)}</b><small>${longest.pages}쪽</small></div>`:''}${best?`<div><span>최고 평점</span><b>${esc(best.title)}</b><small>${starsInline(best.rating)}</small></div>`:''}</div>`:''}</div>
  <div class="sec"><h2>월별 완독</h2>
    <div class="months">${months.map(ms=>`<div class="m">${ms.map(b=>`<i style="--c:${b.color}" title="${esc(b.title)}"></i>`).join('')}</div>`).join('')}</div>
    <div class="mlabels">${Array.from({length:12},(_,i)=>`<span>${i+1}</span>`).join('')}</div>
    <h2 style="margin-top:16px">월별 읽은 쪽</h2>
    <div class="pbars">${mpages.map(v=>`<div><i style="height:${Math.round(v/mp*100)}%" title="${v}"></i></div>`).join('')}</div>
    <div class="mlabels">${Array.from({length:12},(_,i)=>`<span>${i+1}</span>`).join('')}</div></div>
  ${cats.length?`<div class="sec"><h2>분류별 완독</h2>${cats.map(([c,n])=>`<div class="hbar"><span>${esc(c)}</span><div><i style="width:${Math.round(n/done.length*100)}%"></i></div><b>${n}</b></div>`).join('')}
    ${fmts.length?`<p class="hint" style="margin-top:10px">${fmts.map(([f,n])=>`${FORMAT[f]} ${n}권`).join(', ')}</p>`:''}</div>`:''}`;
}

function vSettings(){return `<header class="top"><div><h1>설정</h1></div></header>
  <div class="sec"><h2>언어</h2><div class="seg" style="grid-template-columns:1fr 1fr">${[['ko','한국어'],['en','English']].map(([k,l])=>`<button data-action="lang" data-k="${k}" aria-pressed="${lang()===k}">${l}</button>`).join('')}</div></div>
  <div class="sec"><h2>책장 스타일</h2><div class="skins">${SKINS.map(([k,l,bg,pl])=>`<button data-action="skin" data-k="${k}" aria-pressed="${(S.settings.skin||'wood')===k}" style="--sb:${bg};--sp:${pl}"><i></i>${l}</button>`).join('')}</div></div>
  <div class="sec"><h2>톤 조정</h2>
    <div class="tonerow"><span>밝기</span><b>${S.settings.toneB??50}</b><input type="range" min="0" max="100" value="${S.settings.toneB??50}" data-field="toneB" aria-label="밝기"></div>
    <div class="tonerow"><span>따뜻함</span><b>${S.settings.toneW??50}</b><input type="range" min="0" max="100" value="${S.settings.toneW??50}" data-field="toneW" aria-label="따뜻함"></div>
    ${((S.settings.toneB??50)!=50||(S.settings.toneW??50)!=50)?'<button class="linkbtn" data-action="tonereset" style="margin-top:4px">기본(50)으로 되돌리기</button>':''}<p class="hint">0~100, 가운데 50이 기본이에요. 모든 스킨에 함께 적용되고 표지 이미지는 바뀌지 않아요.</p></div>
  <div class="sec"><h2>데이터 내보내기</h2>${dl?`<div class="hbtns"><button class="btn ghost small" data-action="export" data-k="json">JSON 백업</button><button class="btn ghost small" data-action="export" data-k="csv">CSV (엑셀용)</button></div><p class="hint">JSON에는 표지와 사진까지 모두 들어가요. 이 앱에 다시 가져올 수도 있어요.</p>`:'<p class="hint">이 화면에서는 파일 저장을 쓸 수 없어요.</p>'}</div>
  <div class="sec"><h2>분류 관리</h2>${(()=>{const m={};list().forEach(b=>{const c=b.category||'';if(c)m[c]=(m[c]||0)+1});const cs=Object.entries(m).sort((a,b)=>a[0].localeCompare(b[0],'ko'));
    return cs.length?cs.map(([c,n])=>S.renameCat===c?`<div class="catrow"><input type="text" id="rcat" value="${esc(c)}" style="flex:1;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:7px 10px"><button class="btn small" data-action="rcatok" data-c="${esc(c)}">저장</button><button class="linkbtn" data-action="rcatcancel">취소</button></div>`
      :`<div class="catrow"><span>${esc(c)}</span><small>${n}권</small><button class="linkbtn" data-action="rcat" data-c="${esc(c)}">이름 바꾸기</button></div>`).join(''):'<p class="hint">아직 분류가 없어요</p>'})()}</div>
  <div class="sec"><h2>저장 위치</h2><p style="margin:0;font-size:14px">${S.syncMsg||''}</p></div>`}
let lastMain='';
function renderMain(){
  const v=$('#view');
  const html=tr(S.view==='shelf'?vShelf():S.view==='quotes'?vQuotes():S.view==='goal'?vGoal():vSettings());
  if(html!==lastMain){lastMain=html;v.innerHTML=html}
  const TABS={shelf:'서재',quotes:'문구',goal:'목표',settings:'설정'};
  document.querySelectorAll('.tabs button').forEach(b=>{b.setAttribute('aria-current',b.dataset.tab===S.view?'page':'false');b.lastChild.textContent=trText(TABS[b.dataset.tab])});
  $('#sync').textContent=trText(S.syncMsg||'');
}

/* ---------- detail sheet ---------- */
function splitTitle(t){t=String(t||'').trim();let m=t.match(/^(.{2,}?)\s*[\(（]\s*(.+?)\s*[\)）]\s*$/);if(m)return{main:m[1],sub:m[2]};
  m=t.match(/^(.{2,}?)\s*[:：]\s+(.+)$/);if(m)return{main:m[1],sub:m[2]};
  m=t.match(/^(.{2,}?)\s+[-–]\s+(.+)$/);if(m)return{main:m[1],sub:m[2]};return{main:t,sub:''}}
const starsInline=r=>`<span class="sti" aria-label="평점 ${r}"><span class="bg">★★★★★</span><span class="fg" style="width:${r/5*100}%">★★★★★</span></span>`;
function stars(r){return `<div class="stars" data-action="rate" role="slider" aria-label="평점" aria-valuemin="0" aria-valuemax="5" aria-valuenow="${r||0}" tabindex="0"><span class="bg">★★★★★</span><span class="fg" style="--p:${(r||0)/5*100}%">★★★★★</span></div>`}
function vSheet(){
  const b=S.books[S.openId];if(!b)return '';
  const qs=(b.quotes||[]).slice().sort((a,c)=>(c.at||0)-(a.at||0));
  const prog=b.status==='want'?'':`<div class="sec prog"><h2>진도</h2>
    <div class="nums"><input type="number" min="0" max="${b.pages||9999}" value="${b.current||0}" data-field="current" aria-label="현재 쪽"> / ${b.pages||'?'}쪽 <span id="pctl" style="margin-left:auto">${pct(b)}%</span></div>
    ${b.pages?`<input type="range" min="0" max="${b.pages}" value="${b.current||0}" data-field="range" aria-label="진도 조절">`:''}
    <div class="dates">${[b.startedAt?`시작 ${b.startedAt}`:'',b.finishedAt?`완독 ${b.finishedAt}`:'',(d=>d?`예상 완독 ${d}`:'')(estimate(b))].filter(Boolean).join(', ')}</div>
    ${b.status==='done'?'':`<div style="margin-top:12px">${timerHTML(b)}</div>`}${sessionsHTML(b)}
    ${b.status==='done'?`<div style="margin-top:12px"><button class="btn ghost small" data-action="reread">다시 읽기</button></div>`:''}</div>`;
  let panel='';
  if(S.dtab==='review')panel=`<textarea class="note" data-field="review" placeholder="이 책을 읽고 남기고 싶은 생각을 적어보세요">${esc(b.review||'')}</textarea>`;
  if(S.dtab==='summary')panel=`<textarea class="note" id="sumbox" data-field="summary" placeholder="책 내용을 내 말로 정리해 보세요">${esc(b.summary||'')}</textarea>
    ${sample?`<div class="row" style="margin-top:10px"><p class="hint" style="margin:0">리뷰, 문구, 기록 탭의 메모를 모아 초안을 만들어요</p><button class="btn ghost small" data-action="aisum" id="aibtn">요약 초안 만들기</button></div>`:''}`;
  if(S.dtab==='log')panel=timelineHTML(b);
  if(S.dtab==='quotes')panel=`<div class="qadd"><textarea id="qtext" placeholder="마음에 남은 문장을 옮겨 적어보세요" aria-label="문구"></textarea>
      <div class="acts"><input type="number" id="qpage" placeholder="쪽" aria-label="쪽 번호" min="0"><input type="text" id="qtags" placeholder="태그 (쉼표로 구분)" aria-label="태그" style="width:130px">
      ${sampleImages?'<button class="btn ghost small" data-action="photo" id="phbtn">사진에서 가져오기</button>':''}
      <button class="btn small" data-action="addq" style="margin-left:auto">문구 저장</button></div></div>
    ${qs.length?qs.map(x=>S.editQ===x.id?`<div class="qitem qedit" style="--c:${b.color}"><textarea id="eqtext" aria-label="문구">${esc(x.text||'')}</textarea>
      <div class="acts"><input type="number" id="eqpage" placeholder="쪽" value="${esc(x.page||'')}" min="0" aria-label="쪽 번호"><input type="text" id="eqtags" placeholder="태그 (쉼표로 구분)" value="${esc((x.tags||[]).join(', '))}" style="width:130px" aria-label="태그"><span class="hbtns" style="margin-left:auto"><button class="btn small" data-action="editqsave" data-q="${x.id}">저장</button><button class="btn ghost small" data-action="editqcancel">취소</button></span></div></div>`:`<div class="qitem" style="--c:${b.color}">${x.photo?`<img class="qphoto" src="${x.photo}" alt="저장한 페이지 사진">`:''}${x.text?`<blockquote>${esc(x.text)}</blockquote>`:''}<div class="meta"><span>${x.page?'p.'+esc(x.page):''}${(x.tags||[]).map(g=>` <em class="tag">#${esc(g)}</em>`).join('')}</span></div><div class="qacts"><button data-action="favq" data-q="${x.id}" class="qbtn${x.fav?' fav':''}" aria-pressed="${!!x.fav}">${x.fav?'★ 즐겨찾기됨':'☆ 즐겨찾기'}</button><button data-action="editq" data-q="${x.id}" class="qbtn">✎ 수정</button><button data-action="delq" data-q="${x.id}" class="qbtn danger">${S.delArmQ===x.id?'한 번 더 누르면 삭제':'삭제'}</button></div></div>`).join(''):'<p class="hint" style="text-align:center;padding:16px 0">아직 저장한 문구가 없어요</p>'}`;
  return `<div class="sbar"><button class="linkbtn" data-action="close">닫기</button><div><button class="linkbtn" data-action="edit">정보 수정</button>
    <button class="linkbtn" data-action="del" style="color:var(--danger);margin-left:10px">${S.delArm?'한 번 더 누르면 삭제':'삭제'}</button></div></div>
  ${(()=>{const sp=splitTitle(b.title);const meta=[b.author||'저자 미입력',b.publisher,b.pages?`${b.pages}쪽`:''].filter(Boolean).join(', ');const m2=[FORMAT[b.format],b.category,b.readCount>1?b.readCount+'번 읽음':'',b.isbn?'ISBN '+b.isbn:''].filter(Boolean);
    return `<div class="cover2" style="--c:${b.color}"><div class="cvbox">${b.cover?`<img class="cimg" src="${b.cover}" alt="${esc(b.title)} 표지" decoding="sync">`:`<div class="gen"><span>${esc(sp.main)}</span></div>`}</div>
    <div class="ctext"><div class="ct">${esc(sp.main)}</div>${sp.sub?`<div class="cs">${esc(sp.sub)}</div>`:''}<div class="ca">${esc(meta)}</div>${m2.length?`<div class="ca2">${esc(m2.join(', '))}</div>`:''}</div></div>`})()}
  <div class="sec"><div class="seg" role="group" aria-label="상태">${Object.entries(STATUS).map(([k,l])=>`<button data-action="status" data-s="${k}" aria-pressed="${b.status===k}">${l}</button>`).join('')}</div>
    <div class="row" style="margin-top:14px">${stars(b.rating)}<label class="toggle"><input type="checkbox" data-field="owned" ${b.owned?'checked':''}>소장 중</label></div>
    <div class="row" style="margin-top:12px"><span style="font-size:13px;color:var(--muted);flex:none">책 유형</span><div class="seg" style="flex:1;grid-template-columns:repeat(4,1fr)" role="group" aria-label="책 유형">${Object.entries(FORMAT).map(([k,l])=>`<button data-action="format" data-v="${k}" aria-pressed="${b.format===k}">${l}</button>`).join('')}</div></div></div>
  ${prog}

const AIERR={rate_limited:'요청이 많아요. 잠시 후 다시 시도해 주세요',session_expired:'다시 로그인한 뒤 시도해 주세요',image_rejected:'이 사진은 읽을 수 없어요. 다른 사진을 골라 주세요',refused:'이 요청은 처리할 수 없어요',empty_completion:'결과가 비어 있어요. 다시 시도해 주세요'};

async function aiBookSearch(){const f=S.form;if(!f||!sample||!f.q.trim()||f.searching)return;f.searching=true;f.results=null;renderForm();

실제로 존재한다고 확신하는 책만 최대 5권 골라 JSON 배열로만 답하세요. 각 항목: {"title":"정식 제목(부제 제외)","author":"저자","publisher":"출판사 또는 null","year":출판연도 숫자 또는 null,"pages":확신할 때만 쪽수 숫자 아니면 null,"category":"분류"}.
${lang()==='en'?'제목과 저자는 영어로 쓰세요.':'한국어 번역서는 한국어 제목과 한국어 표기 저자명을 쓰세요.'} category는 가능하면 다음 중 하나: ${cats.join(', ')||'Business, Novel, History, Science, Essays, Self-Improvement'}. 확실하지 않은 책은 넣지 말고, 전혀 모르면 빈 배열 []을 답하세요.`,{modelTier:'default',cache:false});
    f.results=Array.isArray(j)?j.filter(r=>r&&r.title).slice(0,5):[]}
  catch(e){f.results=[];aiFail(e)}

async function aiSummary(){const b=S.books[S.openId];if(!b||!sample)return;
  const box=$('#sumbox'),btn=$('#aibtn');
  if(b.summary&&b.summary.trim()&&btn.dataset.armed!=='1'){btn.dataset.armed='1';btn.textContent='기존 요약 덮어쓰기';return}
  btn.disabled=true;btn.textContent='정리 중...';box.value='생각하는 중...';
  const quotes=(b.quotes||[]).filter(q=>q.text).map(q=>`- ${q.fav?'[★] ':''}${q.text}${q.page?` (p.${q.page})`:''}${(q.tags||[]).length?` #${q.tags.join(' #')}`:''}`).join('\n')||'(없음)';
  const notes=[...(b.sessions||[]).filter(x=>x.note).map(x=>({d:x.date,t:x.note,k:'세션 메모'})),...(b.events||[]).filter(x=>x.type==='note'&&x.text).map(x=>({d:x.date,t:x.text,k:'메모'}))].sort((a,c)=>(a.d||'').localeCompare(c.d||'')).map(x=>`- ${x.d} (${x.k}): ${x.t}`).join('\n')||'(없음)';
  const ses=(b.sessions||[]).filter(x=>x.minutes>0);const mins=ses.reduce((s,x)=>s+(+x.minutes||0),0);
  const period=[b.startedAt?`시작 ${b.startedAt}`:'',b.finishedAt?`완독 ${b.finishedAt}`:'',b.readCount>1?`${b.readCount}번 읽음`:'',ses.length?`타이머 세션 ${ses.length}회, 총 ${mins}분`:''].filter(Boolean).join(', ')||'(없음)';
  const prompt=`다음은 한 독자가 읽은 책에 대한 기록입니다. 이 기록을 바탕으로 책 요약 초안을 ${lang()==='en'?'영어로':'한국어로'} 작성해 주세요.
구성: (1) 책이 무엇을 다루는지 2~3문장, (2) 독자가 특히 반응한 지점과 그 이유 2~3문장(즐겨찾기★ 문구와 메모를 우선 반영), (3) 한 줄 정리. 문단 사이는 빈 줄 하나.
규칙: 책의 실제 내용을 확실히 알지 못하는 부분은 지어내지 말고 독자의 기록에 근거해 정리하세요. 기록이 부족하면 그 사실을 한 문장으로 밝히세요. 날짜나 세션 수 같은 숫자는 본문에 나열하지 말고 흐름을 설명할 때만 쓰세요. 제목이나 머리말 없이 본문만 쓰고, 긴 대시(—)는 쓰지 마세요.
제목: ${b.title}
저자: ${b.author||'미상'}
분류: ${b.category||'(없음)'}
독서 기간과 세션: ${period}
독자 리뷰: ${b.review||'(없음)'}
저장한 문구:
${quotes}
읽으면서 남긴 메모(날짜순):
${notes}`;
  try{const {text}=await sample(prompt,{onText:({text})=>{box.value=text}});box.value=text;b.summary=text;putBook(b);toast('요약 초안을 넣었어요. 자유롭게 고쳐 쓰세요')}
  catch(e){box.value=e&&e.text?e.text:(b.summary||'');aiFail(e)}
  finally{if(btn.isConnected){btn.disabled=false;btn.textContent='요약 초안 만들기';btn.dataset.armed=''}}
}
async function shrink(file){const img=await createImageBitmap(file);const m=1600,s=Math.min(1,m/Math.max(img.width,img.height));
  const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return await new Promise(r=>c.toBlob(r,'image/jpeg',.85))}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-action]');if(!t)return;
  const a=t.dataset.action, b=S.openId?S.books[S.openId]:null;
  if(a!=='del'&&S.delArm){S.delArm=false;if(S.openId)renderSheet()}
  switch(a){
    case 'tab':S.view=t.dataset.tab;if(S.openId)closeBook();renderMain();window.scrollTo(0,0);break;
    case 'filter':S.filter=t.dataset.f;renderMain();break;
    case 'lang':S.settings.lang=t.dataset.k;putSettings();lastMain='';renderAll();break;
    case 'tonereset':S.settings.toneB=50;S.settings.toneW=50;applySkin();putSettings();renderMain();break;
    case 'skin':S.settings.skin=t.dataset.k;applySkin();putSettings();renderMain();break;
    case 'year':S.year=+t.dataset.y;renderMain();break;
    case 'start':startTimer(t.dataset.id);renderSheet();renderMain();break;
    case 'startopen':startTimer(t.dataset.id);openBook(t.dataset.id);renderMain();break;
    case 'finish':S.finishing=true;renderSheet();setTimeout(()=>$('#toPage')?.focus(),30);break;
    case 'finback':S.finishing=false;renderSheet();break;
    case 'sessave':finishSession($('#toPage')?.value,$('#sesNote')?.value);renderSheet();renderMain();break;
    case 'sescancel':S.timer=null;S.finishing=false;saveTimer();renderSheet();renderMain();break;
    case 'reread':reread(b);renderSheet();renderMain();break;
    case 'selmode':S.selMode=!S.selMode;S.sel.clear();renderMain();break;
    case 'seltile':{const id=t.dataset.id;S.sel.has(id)?S.sel.delete(id):S.sel.add(id);renderMain();break}
    case 'selall':{if(S.sel.size)S.sel.clear();else document.querySelectorAll('.tile').forEach(x=>S.sel.add(x.dataset.id));renderMain();break}
    case 'seldone':S.selMode=false;S.sel.clear();renderMain();break;
    case 'bown':bulkApply(x=>x.owned=t.dataset.v==='1');renderMain();break;
    case 'bfmt':bulkApply(x=>x.format=t.dataset.v);renderMain();break;
    case 'bcat':{const v=($('#bcat')?.value||'').trim();if(!v)return;bulkApply(x=>x.category=v);renderMain();break}
    case 'rcat':S.renameCat=t.dataset.c;renderMain();setTimeout(()=>$('#rcat')?.focus(),30);break;
    case 'rcatcancel':S.renameCat=null;renderMain();break;
    case 'rcatok':renameCat(t.dataset.c,$('#rcat')?.value);renderMain();break;
    case 'export':exportData(t.dataset.k);break;
    case 'dot':{const w=t.closest('.dots').previousElementSibling;w.scrollTo({left:(+t.dataset.i)*w.clientWidth,behavior:'smooth'});break}
    case 'qtag':S.qtag=t.dataset.g;renderMain();break;
    case 'qnext':S.qshift=(S.qshift||0)+1;renderMain();break;
    case 'dunit':S.settings.dailyUnit=t.dataset.v;putSettings();renderMain();break;
    case 'dtarget':S.settings.dailyTarget=Math.max(5,Math.min(600,dailyCfg().target+(+t.dataset.d)));putSettings();renderMain();break;
    case 'wdays':S.settings.weeklyDays=Math.max(1,Math.min(7,dailyCfg().days+(+t.dataset.d)));putSettings();renderMain();break;
    case 'rfilter':S.rf=t.dataset.f;renderMain();break;
    case 'add':openForm();break;
    case 'import':openImport();break;
    case 'open':openBook(t.dataset.id);break;
    case 'openq':openBook(t.dataset.id,'quotes');break;
    case 'plus':{const x=S.books[t.dataset.id];const from=x.current||0;x.current=Math.min(x.pages||Infinity,(x.current||0)+10);autoSession(x,from,x.current);if(x.pages&&x.current>=x.pages){setStatus(x,'done');toast(`《${x.title}》 완독을 기록했어요`)}putBook(x);renderMain();break}
    case 'goal':S.settings.goal=Math.max(1,Math.min(365,S.settings.goal+(+t.dataset.d)));putSettings();renderMain();break;
    case 'close':closeBook();break;

const PRESETS=[
 {name:'Goodreads',test:h=>h.includes('Exclusive Shelf')&&h.includes('My Rating'),
  map:r=>{const st={read:'done','currently-reading':'reading','to-read':'want'}[String(r['Exclusive Shelf']).trim()]||'want';

    for(const a of k(0)){const t=String(a.quote||'').trim();if(t)quotes.push({text:t+(a.text&&String(a.text).trim()?'\n- '+String(a.text).trim():''),page:pg(a.page),at:(+a.date||0)*1000})}
    for(const a of k(1)){const f=byName[String(a.photo||'').split('/').pop()];if(!f)continue;
      try{const {url}=await imgToData(await f.async('blob'),640,.72);quotes.push({text:String(a.text||'').trim(),photo:url,page:pg(a.page),at:(+a.date||0)*1000})}catch(e){}}
    const review=k(2).map(a=>String(a.text||'').trim()).filter(Boolean).join('\n\n');
    const events=[...k(4).map(a=>({type:'progress',date:sec2d(+a.date),ts:(+a.date||0)*1000,page:+a.page||0})),...k(6).map(a=>({type:'rated',date:sec2d(+a.date),ts:(+a.date||0)*1000,rating:Math.max(0,Math.min(5,+j.rating||0))})),...k(2).map(a=>({type:'note',date:sec2d(+a.date),ts:(+a.date||0)*1000,text:String(a.text||'').trim()}))].filter(e=>e.date);
    let cover='',color='';const cf=byName[(j.uuid||name.replace(/\.book$/i,''))+'_i.png'];
    if(cf){try{const r=await imgToData(await cf.async('blob'),160,.78,true);cover=r.url;color=r.color}catch(e){}}
    out.push({title:String(j.title).trim(),author:bwAuthor(j.author),publisher:String(j.publisher||'').trim(),isbn:String(j.isbn||'').trim(),translator:String(j.translator||'').trim(),
      category:(c=>CAT_RENAME[c]||c)(String(j.category||'').trim()),pages,current,status,owned:false,format:'',rating:Math.max(0,Math.min(5,+j.rating||0)),startedAt,finishedAt,review,summary:'',quotes,
      readCount:+j.readCount||0,cover,events,color:color||COLORS[hash(j.title)%COLORS.length],createdAt:(+j.date||0)*1000,_ph:placeholder})}
  out.sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));return out}

async function runImport(){const r=buildImport();const now=Date.now();const writes=[];let added=0,merged=0;
  r.books.forEach((nb,i)=>{const ex=r.exist.get(bkey(nb.title,nb.author));
    if(ex){if(IMP.policy==='skip')return;const b={...ex};
      ['author','publisher','isbn','translator','category','cover','readCount','pages','current','rating','startedAt','finishedAt','review','summary','format'].forEach(f=>{if(!b[f]&&nb[f])b[f]=nb[f]});
      if(nb.events&&nb.events.length&&!(b.events||[]).length)b.events=nb.events;
      if(nb.sessions&&nb.sessions.length){const have=new Set((b.sessions||[]).map(x=>x.start));b.sessions=[...(b.sessions||[]),...nb.sessions.filter(x=>!have.has(x.start))]}
      [].forEach(f=>{if(!b[f]&&nb[f])b[f]=nb[f]});
      if(nb.owned)b.owned=true;if(ex.status==='want'&&nb.status!=='want')b.status=nb.status;
      const qk=q=>q.text||String(q.photo||'').slice(-60);const have=new Set((b.quotes||[]).map(qk));b.quotes=[...(b.quotes||[]),...nb.quotes.filter(q=>!have.has(qk(q))).map((q,j)=>({...q,id:uid()+j,at:q.at||now}))];
      b.updatedAt=now;writes.push(b);merged++}
    else{const b={...nb,id:uid(),quotes:nb.quotes.map((q,j)=>({...q,id:uid()+j,at:q.at||now-j})),color:nb.color||COLORS[hash(nb.title)%COLORS.length],
      createdAt:nb.createdAt||now-i,updatedAt:now,source:IMP.mode==='bw'?'bookswing':IMP.mode==='table'?'import':nrm(IMP.src)};delete b._i;delete b._ph;delete b._matched;writes.push(b);added++}});
  IMP.step='run';IMP.total=writes.length;IMP.done=0;renderImp();
  S.importing=true;writes.forEach(b=>{S.books[b.id]=b});saveLocal();
  let failed=0,quota=false;
  if(cloud){const q=writes.slice();const tick=()=>{IMP.done++;const bar=$('#impbar'),c=$('#impcnt');if(bar)bar.style.width=(IMP.done/IMP.total*100)+'%';if(c)c.textContent=IMP.done+' / '+IMP.total};
    const worker=async()=>{while(q.length&&!quota){const b=q.shift();let ok=false;
      for(let t=0;t<4&&!ok;t++){try{await cloud.books.doc(b.id).set(JSON.parse(JSON.stringify(b)));ok=true}
        catch(e){if(e&&e.code==='quota_exceeded'){quota=true;break}if(e&&(e.code==='resource_exhausted'||e.code==='unavailable'))await new Promise(r=>setTimeout(r,800*(t+1)+Math.random()*400));else break}}
      if(!ok){failed++;if(!r.exist.has(bkey(b.title,b.author)))delete S.books[b.id]}tick()}};
    await Promise.all([worker(),worker(),worker()]);if(quota)q.forEach(b=>{failed++;if(!r.exist.has(bkey(b.title,b.author)))delete S.books[b.id]});saveLocal()}
  else{IMP.done=IMP.total}
  S.importing=false;S.synced=true;saveLocal();
  IMP.result={added:added-(failed>0?Math.min(failed,added):0),merged,failed,quota,local:!cloud};IMP.step='done';renderImp();renderMain();
}

async function aiMap(){if(!sample||IMP.aiBusy)return;IMP.aiBusy=true;renderImp();
  const rows=IMP.rows.slice(0,6).map(r=>Object.fromEntries(Object.entries(r).map(([k,v])=>[k,String(v instanceof Date?pDate(v):v).slice(0,80)])));
  const prompt=`독서 기록 앱의 백업 파일 열 이름과 예시 행입니다. 각 항목에 가장 알맞은 열 이름을 골라 JSON 객체 하나로만 답하세요. 맞는 열이 없으면 null.
항목: ${FIELDS.map(([f,l])=>f+'('+l+')').join(', ')}
열 이름: ${JSON.stringify(IMP.cols)}
예시 행: ${JSON.stringify(rows)}
형식 예: {"title":"열이름","author":null}`;
  try{const j=await sample.json(prompt,{modelTier:'quick'});const map={};for(const [f] of FIELDS){if(j&&typeof j[f]==='string'&&IMP.cols.includes(j[f]))map[f]=j[f]}
    if(map.title){IMP.map=map;toast('Claude가 칸을 맞췄어요. 미리보기를 확인해 주세요')}else toast('제목 칸을 찾지 못했어요. 직접 지정해 주세요')}
  catch(e){if(e&&e.code==='invalid_json')toast('결과를 읽지 못했어요. 직접 지정해 주세요');else aiFail(e)}
  IMP.aiBusy=false;renderImp()}

$('#imp').addEventListener('click',e=>{const t=e.target.closest('[data-iact]');if(!t)return;const a=t.dataset.iact;
  if(a==='manual'){IMP.mode='table';useSheet();IMP.step='map';renderImp();return}
  if(a==='close')closeImport();if(a==='pick')$('#impfile').click();if(a==='run')runImport();if(a==='ai')aiMap()});
$('#imp').addEventListener('change',e=>{const t=e.target;
  if(t.dataset.imap){IMP.map[t.dataset.imap]=t.value||undefined;if(!t.value)delete IMP.map[t.dataset.imap];renderImp();return}
  const k=t.dataset.iset;if(!k)return;
  if(k==='sheet'){IMP.sheet=t.value;useSheet()}if(k==='split')IMP.split=t.checked;if(k==='policy')IMP.policy=t.value;
  const st=$('#imp').scrollTop;renderImp();$('#imp').scrollTop=st});

if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
loadLocal();loadTimer();applySkin();migrateCats();renderAll();initCloud();
</script>
